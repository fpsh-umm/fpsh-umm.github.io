<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Praktikum Micro Teaching - FPSH UMM</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        umm: {
                            navy: '#0f172a',
                            dark: '#1e293b',
                            gold: '#f59e0b',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
                padding: 0 !important;
            }
            .page-container {
                max-width: 100% !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .day-card {
                break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
            }
            .shadow-custom {
                box-shadow: none !important;
            }
        }
        

        /* ===== MOBILE FRIENDLY ===== */
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
        .day-card { scroll-margin-top: 64px; }

        .day-nav {
            position: sticky; top: 0; z-index: 30;
            display: flex; gap: 8px; overflow-x: auto;
            margin: 0 -12px; padding: 10px 12px;
            background: rgba(241,245,249,.95); backdrop-filter: blur(6px);
            border-bottom: 1px solid #e2e8f0;
            scrollbar-width: none;
        }
        .day-nav::-webkit-scrollbar { display: none; }
        .day-nav a {
            flex: 0 0 auto; padding: 8px 16px; border-radius: 9999px;
            background: #fff; border: 1px solid #cbd5e1;
            font-size: 13px; font-weight: 700; color: #1e293b; text-decoration: none;
        }
        .day-nav a:active { background: #0f172a; color: #fff; }
        @media (min-width: 768px) { .day-nav { display: none !important; } }
        @media print { .day-nav { display: none !important; } }

        @media (max-width: 767px) {
            body { padding: 12px !important; }
            .page-container { gap: 0; }
            .page-container > * + * { margin-top: 14px; }

            /* Filter bar: full-width, touch-sized, 16px font avoids iOS zoom */
            .controls-bar { padding: 12px !important; gap: 10px !important; align-items: stretch !important; }
            .controls-bar > div { width: 100% !important; }
            .controls-bar .relative { width: 100% !important; }
            .controls-bar input, .controls-bar select { font-size: 16px !important; min-height: 44px; }
            .controls-bar input { padding-left: 2.25rem !important; }
            .controls-bar .flex-wrap { flex-wrap: wrap; gap: 8px !important; }
            .controls-bar .flex-wrap > div:nth-child(2) { flex: 1 1 0; min-width: 0; width: auto !important; }
            .controls-bar .flex-wrap > button { flex: 0 0 auto; padding: 0 12px !important; }
            .controls-bar select { flex: 1; }
            .controls-bar button { min-height: 44px; }
            .controls-bar > div:last-child { justify-content: stretch !important; }
            .controls-bar > div:last-child button { width: 100%; justify-content: center; }

            /* Header */
            header h1 { font-size: 1.25rem !important; line-height: 1.25; }
            header .rounded-lg.shadow-inner { align-self: stretch; justify-content: center; }

            /* Summary metrics: compact vertical cards */
            .metrics { gap: 10px !important; }
            .metrics > div { flex-direction: column; align-items: flex-start !important; gap: 8px !important; padding: 12px !important; }
            .metrics > div > div:first-child { width: 2.5rem !important; height: 2.5rem !important; font-size: 1rem !important; }
            .metrics .text-base { font-size: 15px !important; }
            .metrics .truncate { white-space: normal !important; max-width: none !important; }

            /* Schedule tables -> stacked session cards */
            .day-card table, .day-card tbody { display: block; width: 100%; }
            .day-card thead { display: none; }
            .day-card .overflow-x-auto { overflow-x: visible; }
            .day-card tbody > tr.session-row {
                display: grid;
                grid-template-columns: 1fr auto;
                grid-template-areas: "time prodi" "cls cls" "dosen dosen";
                gap: 4px 12px;
                padding: 14px 16px;
                border-top: 1px solid #f1f5f9;
            }
            .day-card tbody > tr.session-row:first-child { border-top: 0; }
            .day-card tbody > tr.session-row > td { display: block; padding: 0 !important; text-align: left !important; }
            .day-card tbody > tr.session-row > td:nth-child(1) { grid-area: time; }
            .day-card tbody > tr.session-row > td:nth-child(2) { grid-area: cls; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
            .day-card tbody > tr.session-row > td:nth-child(3) { grid-area: dosen; font-size: 14px; line-height: 1.35; padding-top: 6px !important; border-top: 1px dashed #e2e8f0; margin-top: 4px; }
            .day-card tbody > tr.session-row > td:nth-child(4) { grid-area: prodi; align-self: start; }

            .day-card td:nth-child(1) .font-bold { font-size: 17px; }
            .day-card td:nth-child(1) .text-\[10px\] { font-size: 12px; margin-top: 2px; }
            .day-card td:nth-child(2) .font-semibold { font-size: 14px; }
            .day-card td:nth-child(2) .text-\[10px\] { font-size: 12px; }
            .day-card td:nth-child(2) .text-\[10px\]::before { content: "• "; }
            .day-card .prodi-badge { font-size: 12px !important; padding: 4px 10px !important; }
            .day-card .day-head { padding: 14px 16px !important; }

            footer { padding-bottom: 8px; }
        }

        .session-row:hover {
            background-color: #f8fafc;
        }
        .prodi-badge {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .prodi-badge:hover {
            transform: translateY(-1px);
        }
    </style>
</head>

        <!-- BANNER STATUS (data contoh / gagal memuat / peringatan) -->

        <!-- INTERACTIVE CONTROLS BAR (Search & Print) -->

            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto flex-1">
                <div class="relative w-full md:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="filterSchedule()" placeholder="Cari Dosen, Kelas, Ruang..."

                <button onclick="resetFilters()" class="text-xs text-slate-500 hover:text-slate-800 underline font-medium px-2 py-1">

            <div class="flex items-center gap-3 w-full md:w-auto justify-end">

                    <span>Cetak / PDF</span>
                </button>
            </div>
        </div>

        var DEFAULT_SETTINGS = {
            namafakultas: "Fakultas Pendidikan, Sains, dan Humaniora — Universitas Muhammadiyah Malang",
            judul: "JADWAL PRAKTIKUM MICRO TEACHING",
            subjudul: "Semester Ganjil Tahun Akademik 2026/2027 — Laboratorium Microteaching (LMT)",
            nomorsurat: "E.5.d/279/FPSH-UMM/IX/2026",
            tanggalterbit: "21 September 2026",
            labeldokumen: "Dokumen Resmi LMT",
            ruanganutama: "Ruang 619",
            keteranganruangan: "Lab Microteaching FPSH UMM",
            bebanpraktikum: "1 SKS / 2 JS",
            keteranganpraktikum: "Praktikum Semester V (Ganjil)"
        };

        var HARI_URUT = ["SENIN", "SELASA", "RABU", "KAMIS", "JUM'AT", "SABTU", "MINGGU"];
        var DAY_STYLE = {
            "SENIN":  { head: "bg-slate-900 border-slate-800",     icon: "text-amber-400" },
            "SELASA": { head: "bg-rose-900 border-rose-800",       icon: "text-rose-300" },
            "RABU":   { head: "bg-emerald-800 border-emerald-700", icon: "text-emerald-300" },
            "KAMIS":  { head: "bg-slate-800 border-slate-700",     icon: "text-slate-300" },
            "JUM'AT": { head: "bg-purple-900 border-purple-800",   icon: "text-purple-300" },
            "SABTU":  { head: "bg-amber-800 border-amber-700",     icon: "text-amber-300" },
            "MINGGU": { head: "bg-sky-900 border-sky-800",         icon: "text-sky-300" }
        };

        /* Warna badge prodi. Prodi baru otomatis dapat warna dari PALETTE. */
        var PRODI_STYLE = {
            "PGSD":    "bg-sky-100 text-sky-800 border-sky-200",
            "P. MAT":  "bg-amber-100 text-amber-800 border-amber-200",
            "P. BIO":  "bg-emerald-100 text-emerald-800 border-emerald-200",
            "PPKN":    "bg-rose-100 text-rose-800 border-rose-200",
            "P. BING": "bg-purple-100 text-purple-800 border-purple-200",
            "P. BIN":  "bg-pink-100 text-pink-800 border-pink-200"
        };
        var PALETTE = [
            "bg-teal-100 text-teal-800 border-teal-200",
            "bg-indigo-100 text-indigo-800 border-indigo-200",
            "bg-orange-100 text-orange-800 border-orange-200",
            "bg-lime-100 text-lime-800 border-lime-200",
            "bg-cyan-100 text-cyan-800 border-cyan-200",
            "bg-fuchsia-100 text-fuchsia-800 border-fuchsia-200",
            "bg-slate-200 text-slate-800 border-slate-300"
        ];
        var extraProdiStyle = {};

        var CACHE_KEY = "jadwal_microteaching_cache_v1";
        var isLoading = false;

        /* ---------- Utilitas ---------- */
        function esc(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
            });
        }
        function keyOf(s) { return String(s || "").toUpperCase().replace(/\s+/g, " ").trim(); }
        function dayId(label) { return "day-" + String(label).toLowerCase().replace(/[^a-z0-9]/g, ""); }
        function titleCase(s) {
            return String(s).toLowerCase().replace(/(^|\s)([a-z])/g, function (m, a, b) { return a + b.toUpperCase(); });
        }
        function el(id) { return document.getElementById(id); }
        function prodiClass(prodi) {
            var k = keyOf(prodi);
            if (PRODI_STYLE[k]) return PRODI_STYLE[k];
            if (!extraProdiStyle[k]) {
                var n = Object.keys(extraProdiStyle).length;
                extraProdiStyle[k] = PALETTE[n % PALETTE.length];
            }
            return extraProdiStyle[k];
        }
        function isPlaceholderUrl(u) {
            return !u || /PASTE_URL/i.test(u) || !/^https?:\/\//i.test(u);
        }

        /* ---------- Banner status ---------- */
        function showBanner(type, html) {
            var b = el("statusBanner");
            var styles = {
                info:  "bg-sky-50 border-sky-200 text-sky-900",
                warn:  "bg-amber-50 border-amber-300 text-amber-900",
                error: "bg-rose-50 border-rose-300 text-rose-900"
            };
            var icons = { info: "fa-circle-info", warn: "fa-triangle-exclamation", error: "fa-circle-exclamation" };
            b.className = "no-print rounded-xl border px-4 py-3 text-sm flex items-start gap-3 " + styles[type];
            b.innerHTML = '<i class="fa-solid ' + icons[type] + ' mt-0.5"></i><div class="flex-1">' + html + "</div>";
        }
        function hideBanner() { el("statusBanner").className = "no-print hidden"; }

        /* ---------- Render ---------- */
        function setText(id, value, rowId) {
            var v = (value || "").toString().trim();
            el(id).textContent = v;
            if (rowId) el(rowId).style.display = v ? "" : "none";
        }

        function applySettings(serverSettings) {
            var s = {};
            Object.keys(DEFAULT_SETTINGS).forEach(function (k) { s[k] = DEFAULT_SETTINGS[k]; });
            Object.keys(serverSettings || {}).forEach(function (k) {
                var v = String(serverSettings[k] == null ? "" : serverSettings[k]).trim();
                if (v) s[k] = v;
            });
            setText("hdrFakultas", s.namafakultas);
            setText("hdrJudul", s.judul);
            setText("hdrSub", s.subjudul);
            setText("hdrSurat", s.nomorsurat, "hdrSuratRow");
            setText("hdrTanggal", s.tanggalterbit, "hdrTanggalRow");
            setText("hdrLabel", s.labeldokumen, "hdrLabelRow");
            if (!s.nomorsurat && !s.tanggalterbit && !s.labeldokumen) el("hdrBadgeBox").style.display = "none";
            else el("hdrBadgeBox").style.display = "";
            document.title = s.judul + " - FPSH UMM";
            return s;
        }

        function normalizeRows(list) {
            var out = [];
            (list || []).forEach(function (r) {
                if (!r) return;
                out.push({
                    hari: keyOf(r.hari).replace(/[’`´]/g, "'"),
                    mulai: String(r.mulai || "").trim(),
                    selesai: String(r.selesai || "").trim(),
                    jamKe: String(r.jamKe || "").trim(),
                    ruangan: String(r.ruangan || "").trim(),
                    kelas: String(r.kelas || "").trim(),
                    peserta: parseInt(r.peserta, 10) || 0,
                    dosen: String(r.dosen || "").trim(),
                    prodi: String(r.prodi || "").trim()
                });
            });
            return out;
        }

        function rowHtml(r, i) {
            var zebra = i % 2 === 1 ? " bg-slate-50/50" : "";
            var sub = [];
            if (r.jamKe) sub.push("Jam " + esc(r.jamKe));
            if (r.ruangan) sub.push(esc(r.ruangan));
            var kelasTxt = r.kelas ? "Kelas " + esc(r.kelas) : "–";
            var pes = r.peserta > 0 ? '<div class="text-[10px] text-slate-500">' + r.peserta + " Peserta</div>" : "";
            var prodiCell = r.prodi
                ? '<span class="prodi-badge inline-block ' + prodiClass(r.prodi) + ' border font-bold px-2 py-0.5 rounded text-[10px]">' + esc(r.prodi) + "</span>"
                : "";
            return '<tr class="session-row' + zebra + ' transition" data-prodi="' + esc(r.prodi) + '" data-dosen="' + esc(r.dosen) + '">' +
                '<td class="py-2.5 px-3"><div class="font-bold text-slate-900">' + esc(r.mulai) + " - " + esc(r.selesai) + "</div>" +
                    '<div class="text-[10px] text-slate-400">' + sub.join(" • ") + "</div></td>" +
                '<td class="py-2.5 px-3"><div class="font-semibold text-slate-800">' + kelasTxt + "</div>" + pes + "</td>" +
                '<td class="py-2.5 px-3 font-semibold text-slate-800">' + esc(r.dosen) + "</td>" +
                '<td class="py-2.5 px-3 text-center">' + prodiCell + "</td></tr>";
        }

        function dayCardHtml(label, rows) {
            var st = DAY_STYLE[label] || { head: "bg-slate-800 border-slate-700", icon: "text-slate-300" };
            return '<div id="' + dayId(label) + '" class="day-card bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm flex flex-col justify-between"><div>' +
                '<div class="day-head ' + st.head + ' text-white px-4 py-3 flex justify-between items-center border-b">' +
                    '<div class="flex items-center gap-2"><i class="fa-solid fa-calendar-day ' + st.icon + '"></i>' +
                    '<span class="font-extrabold text-base tracking-wider uppercase">' + esc(label) + "</span></div>" +
                    '<span class="bg-white/20 text-white text-xs px-2.5 py-0.5 rounded-full font-semibold">' + rows.length + " Sesi</span></div>" +
                '<div class="overflow-x-auto"><table class="w-full text-left text-xs border-collapse"><thead>' +
                    '<tr class="bg-slate-50 text-slate-500 border-b border-slate-200 uppercase font-semibold text-[10px]">' +
                    '<th class="py-2.5 px-3">Waktu / Jam</th><th class="py-2.5 px-3">Kls / Mhs</th>' +
                    '<th class="py-2.5 px-3">Dosen Pengampu</th><th class="py-2.5 px-3 text-center">Prodi</th></tr></thead>' +
                '<tbody class="divide-y divide-slate-100 font-medium">' + rows.map(rowHtml).join("") + "</tbody></table></div></div></div>";
        }

        function render(data) {
            var settings = applySettings(data.settings);
            var rows = normalizeRows(data.jadwal);

            // kelompokkan per hari
            var byDay = {};
            rows.forEach(function (r) { (byDay[r.hari] = byDay[r.hari] || []).push(r); });
            var days = HARI_URUT.filter(function (h) { return byDay[h]; });
            Object.keys(byDay).forEach(function (h) { if (days.indexOf(h) < 0) days.push(h); });

            days.forEach(function (h) {
                byDay[h].sort(function (a, b) { return a.mulai < b.mulai ? -1 : a.mulai > b.mulai ? 1 : 0; });
            });

            el("scheduleGrid").innerHTML = days.map(function (h) { return dayCardHtml(h, byDay[h]); }).join("");
            el("dayNav").innerHTML = days.map(function (h) {
                return '<a href="#' + dayId(h) + '">' + esc(titleCase(h)) + "</a>";
            }).join("");
            el("dayNav").style.display = days.length ? "" : "none";

            // dropdown prodi (pertahankan pilihan bila masih ada)
            var prodiList = [];
            rows.forEach(function (r) { if (r.prodi && prodiList.indexOf(r.prodi) < 0) prodiList.push(r.prodi); });
            var sel = el("prodiFilter"), prev = sel.value;
            sel.innerHTML = '<option value="ALL">Semua Prodi</option>' +
                prodiList.map(function (p) { return '<option value="' + esc(p) + '">' + esc(p) + "</option>"; }).join("");
            sel.value = prodiList.indexOf(prev) >= 0 ? prev : "ALL";

            // kartu ringkasan
            el("mSesi").textContent = rows.length + " Sesi Praktikum";
            el("mSesiSub").textContent = !days.length ? "" :
                days.length === 1 ? "Terjadwal " + titleCase(days[0]) :
                "Terjadwal " + titleCase(days[0]) + " s.d. " + titleCase(days[days.length - 1]);
            el("mRuang").textContent = settings.ruanganutama;
            el("mRuangSub").textContent = settings.keteranganruangan;
            el("mProdi").textContent = prodiList.length + " Program Studi";
            el("mProdiSub").textContent = prodiList.join(", ");
            el("mProdiSub").title = prodiList.join(", ");
            el("mBeban").textContent = settings.bebanpraktikum;
            el("mBebanSub").textContent = settings.keteranganpraktikum;

            filterSchedule();
        }

        /* ---------- Filter & pencarian ---------- */
        function filterSchedule() {
            var searchValue = el("searchInput").value.toLowerCase().trim();
            var selectedProdi = el("prodiFilter").value;
            var rows = document.querySelectorAll(".session-row");
            var visible = 0;

            rows.forEach(function (row) {
                var text = row.innerText.toLowerCase();
                var prodi = row.getAttribute("data-prodi");
                var ok = text.indexOf(searchValue) >= 0 && (selectedProdi === "ALL" || prodi === selectedProdi);
                row.style.display = ok ? "" : "none";
                if (ok) visible++;
            });

            var empty = el("emptyState");
            if (rows.length === 0) {
                el("emptyText").textContent = isLoading ? "Memuat jadwal…" : "Belum ada data jadwal. Isi sheet \"Jadwal\" di Google Spreadsheet.";
                empty.classList.remove("hidden");
            } else if (visible === 0) {
                el("emptyText").textContent = "Tidak ada jadwal yang cocok dengan pencarian.";
                empty.classList.remove("hidden");
            } else {
                empty.classList.add("hidden");
            }
        }

        function resetFilters() {
            el("searchInput").value = "";
            el("prodiFilter").value = "ALL";
            filterSchedule();
        }

        /* ---------- Cache lokal (dipakai bila koneksi gagal) ---------- */
        function saveCache(data) {
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data: data })); } catch (e) {}
        }
        function readCache() {
            try { var c = JSON.parse(localStorage.getItem(CACHE_KEY)); return c && c.data ? c : null; } catch (e) { return null; }
        }

        function fmtTime(d) {
            return d.toLocaleString("id-ID", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        }

        /* ---------- Ambil data dari Apps Script ---------- */
        function setBusy(b) {
            isLoading = b;
            el("refreshIcon").className = "fa-solid fa-rotate" + (b ? " fa-spin" : "");
            el("refreshBtn").disabled = b;
        }

        async function fetchLive(manual) {
            var url = CONFIG.SCRIPT_URL + (CONFIG.SCRIPT_URL.indexOf("?") > -1 ? "&" : "?") +
                      "t=" + Date.now() + (manual ? "&refresh=1" : "");
            var ctrl = new AbortController();
            var timer = setTimeout(function () { ctrl.abort(); }, 20000);
            try {
                var res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error("HTTP " + res.status);
                var data = await res.json();
                if (!data || data.ok === false) throw new Error((data && data.error) || "Respons tidak valid dari Apps Script");
                return data;
            } finally {
                clearTimeout(timer);
            }
        }

        async function loadData(manual) {
            if (isLoading) return;

            // Belum dikonfigurasi -> data contoh
            if (isPlaceholderUrl(CONFIG.SCRIPT_URL)) {
                render(SAMPLE_DATA);
                el("updatedText").textContent = "";
                el("refreshBtn").style.display = "none";
                showBanner("info", "<b>Menampilkan data contoh.</b> Sambungkan halaman ini ke Google Spreadsheet dengan mengisi <code>SCRIPT_URL</code> di bagian bawah file <code>index.html</code> (lihat SETUP.md).");
                return;
            }

            setBusy(true);
            if (!document.querySelector(".session-row")) filterSchedule(); // tampilkan "Memuat…"
            try {
                var data = await fetchLive(manual);
                saveCache(data);
                render(data);
                el("updatedText").textContent = "Diperbarui: " + fmtTime(new Date());
                var warn = (data.warnings || []).slice(0, 5);
                if (warn.length) {
                    showBanner("warn", "<b>Sebagian baris di spreadsheet dilewati:</b><br>" + warn.map(esc).join("<br>"));
                } else if (!data.jadwal || !data.jadwal.length) {
                    showBanner("warn", "Sheet <b>Jadwal</b> terhubung, tetapi belum ada baris jadwal.");
                } else {
                    hideBanner();
                }
            } catch (err) {
                var cached = readCache();
                var msg = esc(err && err.message ? err.message : err);
                if (cached) {
                    render(cached.data);
                    el("updatedText").textContent = "Data tersimpan: " + fmtTime(new Date(cached.savedAt));
                    showBanner("warn", "<b>Tidak bisa mengambil data terbaru</b> (" + msg + "). Menampilkan data terakhir yang tersimpan di perangkat ini.");
                } else {
                    render(SAMPLE_DATA);
                    el("updatedText").textContent = "";
                    showBanner("error", "<b>Gagal memuat data dari spreadsheet</b> (" + msg + "). Yang tampil sekarang hanya <b>data contoh</b>, bukan jadwal terbaru. Periksa URL Web App dan pengaturan akses (Anyone) di SETUP.md, lalu klik “Segarkan data”.");
                }
            } finally {
                setBusy(false);
            }
        }

        /* ---------- Mulai ---------- */
        el("footYear").textContent = new Date().getFullYear();
        loadData(false);
        if (CONFIG.AUTO_REFRESH_MINUTES > 0 && !isPlaceholderUrl(CONFIG.SCRIPT_URL)) {
            setInterval(function () { if (!document.hidden) loadData(false); }, CONFIG.AUTO_REFRESH_MINUTES * 60000);
        }
    </script>
