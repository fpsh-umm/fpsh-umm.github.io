<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Penjadwalan Perkuliahan — FPSH UMM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8fa;--card:#fff;--ink:#12303a;--mut:#587077;--line:#d6e5ea;--yel:#f0a331;--brand:#278da3;--brand2:#1b6a7c;--soft:#e1f1f5;--ok:#12805c;--okb:#e3f5ee;--warn:#a15c07;--warnb:#fdf1dc;--navy:#278da3;--r:14px;--sh:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.05)}
:root[data-theme=dark]{--bg:#0c1a1f;--card:#14262d;--ink:#e6f2f5;--mut:#9bb5bd;--line:#28424b;--navy:#17586a;--brand:#2f9bb5;--brand2:#6cc3d6;--soft:#1a3640;--okb:#12332a;--warnb:#33270f;--sh:none}
*{box-sizing:border-box;margin:0}body{font:14px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}.hide{display:none!important}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top{max-width:1200px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:44px;border-radius:10px;background:#fff;padding:4px 8px;display:flex;align-items:center}.logo img{height:100%;width:auto;display:block}
.brand b{display:block;font-size:16px;letter-spacing:-.01em}.brand span{font-size:12px;opacity:.7}
.sp{flex:1}.ibtn,.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;transition:.15s}
header .ibtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:#fff}
.btn:hover,.ibtn:hover{filter:brightness(.96)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.d{color:var(--brand)}
nav{max-width:1200px;margin:auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
nav button{background:none;border:0;color:#fff;opacity:.65;padding:10px 16px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{opacity:1;border-color:var(--yel)}
main{max-width:1200px;margin:auto;padding:22px 20px 60px}
.banner{background:var(--warnb);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.stat small{color:var(--mut);font-weight:600}.stat strong{display:block;font-size:32px;letter-spacing:-.03em;line-height:1.15;margin-top:4px}
.two{grid-template-columns:1.2fr 1fr}@media(max-width:820px){.two{grid-template-columns:1fr}}
h2{font-size:17px;letter-spacing:-.01em;margin-bottom:12px}
.bar{display:grid;grid-template-columns:70px 1fr 34px;gap:10px;align-items:center;margin:9px 0;font-weight:500}.bar i{height:10px;border-radius:6px;background:var(--brand);display:block;min-width:3px}.bar div{background:var(--bg);border-radius:6px}
.tool{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.tool>*{min-width:0}
input,select,textarea{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;width:100%}input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
.tool select,.tool input{width:auto;flex:1 1 170px}.tool .grow{flex:2 1 240px}
.day{margin-bottom:22px}.day h3{font-size:15px;margin:0 0 8px;display:flex;gap:8px;align-items:center}.day h3 em{font-style:normal;font-weight:500;color:var(--mut);font-size:12px}
.row{display:grid;grid-template-columns:118px 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c,var(--brand));border-radius:12px;padding:12px 14px;margin-bottom:8px}
.row.live{box-shadow:0 0 0 2px var(--ok)}.time b{display:block;font-size:15px}.time small{color:var(--mut)}
.mk{font-weight:700}.meta{color:var(--mut);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:2px}
.tag{display:inline-block;border-radius:20px;padding:1px 10px;font-size:12px;font-weight:600;background:var(--soft);color:var(--brand)}.tag.ok{background:var(--okb);color:var(--ok)}
.acts{display:flex;gap:6px}.acts button{padding:5px 10px;font-size:12px}
@media(max-width:640px){.row{grid-template-columns:1fr}}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px}th,td{border:1px solid var(--line);padding:0;text-align:center;font-size:12px;height:46px}
th{background:var(--bg);padding:6px;font-weight:700;position:sticky;top:0}td.rn,th.rn{text-align:left;padding:6px 10px;min-width:130px;position:sticky;left:0;background:var(--card);font-weight:600;z-index:1}th.rn{background:var(--bg)}th.sj{min-width:84px;white-space:nowrap;line-height:1.3}th.sj small{font-weight:600;color:var(--mut);font-size:10px}
td.f{background:var(--brand);color:#fff;font-weight:600;padding:2px 4px;cursor:pointer;overflow:hidden;max-width:90px;text-overflow:ellipsis;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(10,16,32,.55);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--card);border-radius:18px;width:min(720px,100%);max-height:92vh;overflow:auto;padding:22px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f2 .w{grid-column:1/-1}@media(max-width:560px){.f2{grid-template-columns:1fr}}
label{display:block;font-weight:600;font-size:12px;color:var(--mut);margin-bottom:4px}
.err{background:var(--soft);color:var(--brand);border-radius:12px;padding:10px 14px;margin:12px 0;font-weight:500}.err ul{margin:6px 0 0 18px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:12px;z-index:90;box-shadow:var(--sh)}
table.kt{min-width:0}.kt th,.kt td{height:auto;padding:4px;text-align:left}.kt input,.kt select{padding:6px 8px;min-width:70px}.kt td:last-child{white-space:nowrap}
.kfas{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0}.kfas label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink);margin:0}.kfas input{width:auto}
.sheet.lg{width:min(430px,100%);padding:38px 28px 28px;border-radius:24px;position:relative}
.lx{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:0 2px 10px rgba(16,24,40,.12);cursor:pointer;color:var(--mut);font-size:18px;line-height:1}
.lgo{display:flex;justify-content:center}.lgo img{width:130px;height:130px;object-fit:contain;background:#fff;border-radius:18px}
.lt{font-size:26px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:14px 0 6px}
.ls{text-align:center;color:var(--brand);font-weight:700;font-size:16px;margin-bottom:22px}
.ll{text-transform:uppercase;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.02em;margin:16px 0 8px}
.inw{position:relative}.inw svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:22px;height:22px;color:#98a2b3;pointer-events:none}
.inw input{padding:15px 14px 15px 50px;border-radius:14px;border:1.5px solid var(--line);font-size:15px}
.lbtn{width:100%;margin-top:22px;padding:15px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 4px 12px rgba(39,141,163,.3)}.lbtn:hover{filter:brightness(.94)}.lbtn:disabled{opacity:.6;cursor:wait}
.copy{margin-top:8px;font-size:12px;color:var(--mut);text-align:center}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:7px;min-width:0}.hctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hclock{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:baseline;gap:2px 14px;font-size:12px;line-height:1.3}.hclock .tgl{opacity:.85}.hclock .jam{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.hclock .idle{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}.hclock .idle.warn{color:#fcee1f;opacity:1;font-weight:700}
@media print{.hclock .idle{display:none!important}}
.toast.proses{display:flex;align-items:center;gap:10px;background:var(--navy);border:1px solid rgba(255,255,255,.18)}
.toast.proses::before{content:"";width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* identitas pengguna */
.hid{text-align:right;font-size:12px;line-height:1.3;max-width:340px;align-self:center}.hid b{display:block;font-size:13px}.hid span{opacity:.8}
header{border-bottom:4px solid var(--yel)}
.brand span{opacity:.92!important}nav button{opacity:.85}nav button:hover{opacity:1}
.card.stat{border-top:4px solid var(--yel)}.btn.p{color:#fff}.btn.p:hover{background:var(--brand2);border-color:var(--brand2)}
.row.live{box-shadow:0 0 0 2px var(--yel)}.toast,.toast.proses{background:#0f2a33;color:#fff}
.bar i{background:linear-gradient(90deg,var(--brand),#f0a331)}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}footer a{color:var(--brand);cursor:pointer;font-weight:600}
@media print{header nav,.tool,.acts,.banner,footer,.ibtn{display:none!important}body{background:#fff}.top{color:#000}header{position:static;background:none;color:#000}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* ===== KONFIGURASI — tempel URL Web App Apps Script di sini ===== */
var CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbxCaDFv2QvOWHySELpdoyQ6l095GLRHKGHNapxmc9G5bneWcI7L53ULBbl750AOMgS52Q/exec",
  AUTO_REFRESH_MINUTES: 5
};
/* ================================================================ */
var DEMO = CONFIG.SCRIPT_URL.indexOf("PASTE_") === 0;
var HARI_JS = ["Minggu","Senin","Selasa","Rabu","Kamis","Jum'at","Sabtu"];
var S = { d:null, user:null, token:null, tab:"ringkasan", ta:"", sem:"Ganjil", prodi:"", hari:"", q:"", rhari:"Senin" };
var $ = function(i){return document.getElementById(i)};
var esc = function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var PAL = ["#278da3","#b4232a","#12805c","#8a4fbf","#c26a0a","#3f5f2f","#a02e6d"];
/* Program studi: urutan & singkatan baku (selalu tampil berurutan seperti ini) */
var PRODI_BAKU = [["Pendidikan Matematika","MTK"],["Pendidikan Biologi","BIO"],["Pendidikan Bahasa Indonesia","BSI"],["Pendidikan Pancasila dan Kewarganegaraan","PPKn"],["Pendidikan Bahasa Inggris","ELED"],["Pendidikan Guru Sekolah Dasar","PGSD"],["Pendidikan Kepelatihan Olahraga","PKO"]];
function pLabel(p){return p} /* singkatan prodi TIDAK ditampilkan di aplikasi (hanya nama lengkap) */
function urutProdi(dariData){ // 7 prodi baku selalu di depan sesuai urutan; prodi lain dari data (jika ada) menyusul urut abjad
  var baku=(S.d&&S.d.prodi&&S.d.prodi.length)?S.d.prodi.map(function(p){return p.nama}):PRODI_BAKU.map(function(p){return p[0]}); // urutan dari sheet "Prodi" (cadangan: urutan baku)
  return baku.concat(Array.from(new Set(dariData)).filter(function(p){return p&&baku.indexOf(p)<0}).sort());
}
var col = function(p){var l=S.d.prodiList;return PAL[Math.max(0,l.indexOf(p))%PAL.length]};
function toast(m,ms){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},ms||2800)}

/* ---------- jam (hari, tanggal, jam) & logout otomatis bila tidak ada aktivitas ---------- */
var IDLE_MENIT=90, IDLE_MS=IDLE_MENIT*60000, LAST=Date.now();
function p2(n){return (n<10?"0":"")+n}
function simpanSesi(){try{if(S.user)sessionStorage.setItem("pk",JSON.stringify({u:S.user,t:S.token,a:LAST}))}catch(e){}}
function keluar(otomatis){
  if(S.token) post({action:"logout"});
  S.user=S.token=null; try{sessionStorage.removeItem("pk")}catch(e){}
  tutup(); render();
  if(otomatis) toast("Sesi berakhir: tidak ada aktivitas selama "+IDLE_MENIT+" menit. Silakan login kembali.",7000);
}
function tick(){
  var n=new Date();
  $("hTgl").textContent=n.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("hJam").textContent=p2(n.getHours())+":"+p2(n.getMinutes())+":"+p2(n.getSeconds());
  var el=$("hIdle");
  if(!S.user){el.classList.add("hide");return}
  var sisa=IDLE_MS-(n.getTime()-LAST);
  if(sisa<=0){keluar(true);return}
  var s=Math.ceil(sisa/1000);
  el.textContent="Logout otomatis: "+p2(Math.floor(s/3600))+":"+p2(Math.floor(s%3600/60))+":"+p2(s%60);
  el.classList.toggle("warn",sisa<=5*60000); el.classList.remove("hide");
  simpanSesi();
}
["mousemove","mousedown","keydown","touchstart","wheel","scroll","click"].forEach(function(ev){window.addEventListener(ev,function(){LAST=Date.now()},{passive:true,capture:true})});
document.addEventListener("visibilitychange",tick);
setInterval(tick,1000);

/* ---------- API ---------- */
/* Toast "Tunggu... memproses database" selama perubahan/penyimpanan berlangsung (hilang otomatis saat selesai, berhasil maupun gagal) */
var PROSES={n:0,el:null};
function proses(on){
  PROSES.n=Math.max(0,PROSES.n+(on?1:-1));
  if(PROSES.n>0&&!PROSES.el){var t=document.createElement("div");t.className="toast proses";t.setAttribute("role","status");t.textContent="Tunggu... memproses database";document.body.appendChild(t);PROSES.el=t}
  if(PROSES.n===0&&PROSES.el){PROSES.el.remove();PROSES.el=null}
}
var AKSI_UBAH=/^(save|delete|cfgSave|cfgUserSave|cfgUserDelete|rkUpload|rkSebar|rkUnduh|rkPulihkan)$/;
function post(body){
  body.token = S.token;
  var ubah = AKSI_UBAH.test(body.action); if(ubah) proses(true);
  var p = DEMO ? demoPost(body)
    : fetch(CONFIG.SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).then(function(r){return r.json()});
  return ubah ? p.then(function(r){proses(false);return r},function(e){proses(false);throw e}) : p;
}
function muat(manual){
  var p = DEMO ? Promise.resolve(S.d ? {ok:true,data:S.d} : {ok:true,data:demoData()})
    : fetch(CONFIG.SCRIPT_URL+"?action=data").then(function(r){return r.json()});
  return p.then(function(res){
    if(!res.ok) throw new Error(res.error);
    S.d = res.data; S.d.prodiList = urutProdi(S.d.mk.map(function(m){return m.prodi}).concat(S.d.jadwal.map(function(r){return r.prodi})));
    var tas = S.d.config.ta_aktif || S.d.config.ta_list || ["—"];
    if(!S.ta) { S.ta = tas[0]; var g=S.d.config.semester||{}; S.sem = g.genap?"Genap":"Ganjil"; }
    $("selTA").innerHTML = tas.map(function(t){return "<option "+(t===S.ta?"selected":"")+">"+esc(t)+"</option>"}).join("");
    $("selSem").innerHTML = ["Ganjil","Genap","Sela Ganjil","Sela Genap"].map(function(t){return "<option "+(t===S.sem?"selected":"")+">"+t+"</option>"}).join("");
    $("upd").textContent = "Diperbarui " + new Date(S.d.updated).toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"});
    $("banner").innerHTML = DEMO ? '<div class="banner">Mode demo: menampilkan data contoh. Tempel URL Web App di <code>CONFIG.SCRIPT_URL</code> untuk memakai spreadsheet asli (lihat SETUP.md).</div>' : "";
    render(); if(manual) toast("Data disegarkan");
  }).catch(function(e){ $("banner").innerHTML='<div class="banner">Gagal memuat data: '+esc(e.message)+'</div>' });
}

/* ---------- helper jadwal ---------- */
function jam(ke){return S.d.jam.filter(function(j){return j.ke===ke})[0]}
function waktu(r){var a=jam(r.mulai),b=jam(r.selesai);return a&&b?[a.waktu.split(" - ")[0],b.waktu.split(" - ")[1]]:["?","?"]}
function aktif(r){return r.ta===S.ta && r.sem===S.sem}
function daftar(){return S.d.jadwal.filter(function(r){
  return aktif(r)&&(!S.prodi||r.prodi===S.prodi)&&(!S.hari||r.hari===S.hari)&&
   (!S.q||(r.mk+" "+r.dosen.join(" ")+" "+r.ruang+" "+r.kelas).toLowerCase().indexOf(S.q.toLowerCase())>-1)})}
function berlangsung(r){
  var n=new Date(); if(HARI_JS[n.getDay()]!==r.hari) return false; var w=waktu(r), m=n.getHours()*60+n.getMinutes();
  var f=function(t){var p=t.split(":");return p[0]*60+ +p[1]}; return w[0]!=="?"&&m>=f(w[0])&&m<=f(w[1]);
}
/* Level pengguna: kunci -> label. Hak bawaan (FAS_DEF) dapat diubah per pengguna di Konfigurasi Data > Pengguna & Hak Akses. */
var LEVELS=[["super_admin","Super Admin"],["admin","Admin"],["tendik_fak","Tendik Fak."],["tendik_prodi","Tendik Prodi"],["kaprodi","Ketua/Sekretaris Prodi"],["dekanat","Dekanat"],["viewer","Viewer"]];
var LV_LABEL={}; LEVELS.forEach(function(l){LV_LABEL[l[0]]=l[1]});
var LV_BACA=["dekanat","viewer"];                    /* hanya melihat data */
var LV_PRODI=["admin","tendik_prodi","kaprodi"];     /* dibatasi pada prodi terkunci (bila terisi) */
var LV_WAJIB_PRODI=["tendik_prodi","kaprodi"];       /* prodi terkunci wajib diisi */
var FAS_DEF={super_admin:["tambah","ubah","hapus"],admin:["tambah","ubah","hapus"],tendik_fak:["tambah","ubah","hapus"],tendik_prodi:["tambah","ubah","hapus"],kaprodi:["tambah","ubah","hapus"],dekanat:[],viewer:[]};
function lvLabel(l){return LV_LABEL[l]||l}
function terkunci(){return !!(S.user&&LV_PRODI.indexOf(S.user.level)>-1&&S.user.prodi)}
function can(f){if(!S.user)return false;if(S.user.level==="super_admin")return true;if(LV_BACA.indexOf(S.user.level)>-1)return false;var fas=S.user.fas||FAS_DEF[S.user.level]||[];return fas.indexOf(f)>-1}
function adminTambah(){return !!S.user&&(S.user.level==="admin"||S.user.level==="super_admin")&&can("tambah")} /* tombol + Tambah jadwal: hanya admin & super_admin */
function bisaEdit(r,f){return can(f||"ubah")&&!(terkunci()&&r&&r.prodi!==S.user.prodi)}

/* ---------- render ---------- */
function render(){
  var tabs=[["ringkasan","Ringkasan"],["jadwal","Jadwal"],["ruang","Pemakaian Ruang"]];
  if(bisaPenjadwalan()||isTP()) tabs.push(["penjadwalan","Penjadwalan"]); else if(S.tab==="penjadwalan") S.tab="ringkasan";
  var sa=S.user&&S.user.level==="super_admin"; if(sa) tabs.push(["konfigurasi","Konfigurasi Data"]); else if(S.tab==="konfigurasi") S.tab="ringkasan";
  $("tabs").innerHTML=tabs.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="S.tab=\''+t[0]+'\';render()">'+t[1]+"</button>"}).join("");
  ["ringkasan","jadwal","ruang","penjadwalan","konfigurasi"].forEach(function(v){$("v-"+v).classList.toggle("hide",S.tab!==v)});
  $("btnLogin").textContent = S.user ? "Keluar" : "Masuk";
  $("hUser").classList.toggle("hide",!S.user);
  if(S.user) $("hUser").innerHTML="<b>"+esc(S.user.nama)+"</b><span>"+esc(S.user.email)+"</span><br><span>"+esc(lvLabel(S.user.level))+(S.user.prodi?" · "+esc(S.user.prodi):"")+"</span>";
  if(S.tab==="ringkasan") vRingkasan(); if(S.tab==="jadwal") vJadwal(); if(S.tab==="ruang") vRuang(); if(S.tab==="penjadwalan") vPenjadwalan(); if(S.tab==="konfigurasi") vKonfigurasi();
}
function vRingkasan(){
  var j=S.d.jadwal.filter(aktif), hari=S.d.hari, per={}, load={};
  hari.forEach(function(h){per[h]=0}); j.forEach(function(r){per[r.hari]=(per[r.hari]||0)+1; r.dosen.forEach(function(d){load[d]=(load[d]||0)+(r.selesai-r.mulai+1)})});
  var mx=Math.max(1,Math.max.apply(null,hari.map(function(h){return per[h]||0})));
  var pr={}; j.forEach(function(r){pr[r.prodi]=(pr[r.prodi]||0)+1});
  var top=Object.keys(load).sort(function(a,b){return load[b]-load[a]}).slice(0,6);
  var live=j.filter(berlangsung);
  $("v-ringkasan").innerHTML='<div class="grid stats">'+
   [["Sesi terjadwal",j.length],["Program studi",Object.keys(pr).length],["Dosen mengajar",Object.keys(load).length],["Ruang terpakai",new Set(j.map(function(r){return r.ruang})).size]]
   .map(function(s){return '<div class="card stat"><small>'+s[0]+'</small><strong>'+s[1]+'</strong></div>'}).join("")+'</div>'+
   (live.length?'<div class="card" style="margin-bottom:14px"><h2><span class="tag ok">Sedang berlangsung</span></h2>'+live.map(rowHtml).join("")+'</div>':"")+
   '<div class="grid two"><div class="card"><h2>Sesi per hari</h2>'+hari.map(function(h){return '<div class="bar"><span>'+esc(h)+'</span><div><i style="width:'+(per[h]/mx*100)+'%"></i></div><b>'+(per[h]||0)+'</b></div>'}).join("")+'</div>'+
   '<div class="card"><h2>Beban jam dosen tertinggi</h2>'+(top.length?top.map(function(d){return '<div class="bar" style="grid-template-columns:1fr 50px"><span>'+esc(d)+'</span><b>'+load[d]+' JS</b></div>'}).join(""):'<div class="empty">Belum ada data.</div>')+'</div></div>';
}
function rowHtml(r){
  var w=waktu(r), lv=berlangsung(r);
  return '<div class="row'+(lv?" live":"")+'" style="--c:'+col(r.prodi)+'"><div class="time"><b>'+w[0]+" – "+w[1]+'</b><small>Jam ke-'+r.mulai+(r.selesai>r.mulai?"–"+r.selesai:"")+'</small></div>'+
  '<div><div class="mk">'+esc(r.mk)+(lv?' <span class="tag ok">Berlangsung</span>':"")+'</div><div class="meta"><span>'+esc(pLabel(r.prodi))+(r.smt?" · Smt "+r.smt:"")+(r.kelas?" · Kelas "+esc(r.kelas):"")+'</span><span>'+esc(r.dosen.join(", ")||"Dosen belum ditentukan")+'</span><span class="tag">Ruang '+esc(r.ruang)+'</span></div></div>'+
  ((bisaEdit(r,"ubah")||bisaEdit(r,"hapus"))?'<div class="acts">'+(bisaEdit(r,"ubah")?'<button class="btn" onclick="bukaForm(\''+r.id+'\')">Ubah</button>':"")+(bisaEdit(r,"hapus")?'<button class="btn d" onclick="hapus(\''+r.id+'\')">Hapus</button>':"")+'</div>':"")+'</div>';
}
function vJadwal(){
  var opt=function(a,v,all,lab){return '<option value="">'+all+'</option>'+a.map(function(x){return '<option value="'+esc(x)+'" '+(x===v?"selected":"")+'>'+esc(lab?lab(x):x)+'</option>'}).join("")};
  var l=daftar(), h='<div class="tool"><select onchange="S.prodi=this.value;vJadwal()">'+opt(S.d.prodiList,S.prodi,"Semua program studi",pLabel)+'</select><select onchange="S.hari=this.value;vJadwal()">'+opt(S.d.hari,S.hari,"Semua hari")+'</select>'+
   '<input class="grow" id="q" placeholder="Cari mata kuliah, dosen, ruang…" value="'+esc(S.q)+'" oninput="S.q=this.value;cari()">'+(adminTambah()?'<button class="btn p" onclick="bukaForm()">Penjadwalan Manual</button>':"")+'</div><div id="list"></div>';
  $("v-jadwal").innerHTML=h; cari();
}
function cari(){
  var l=daftar(), el=$("list"); if(!el) return;
  if(!l.length){el.innerHTML='<div class="card empty">Tidak ada jadwal yang cocok untuk '+esc(S.ta)+" · "+esc(S.sem)+".</div>";return}
  el.innerHTML=S.d.hari.map(function(h){
    var g=l.filter(function(r){return r.hari===h}).sort(function(a,b){return a.mulai-b.mulai}); if(!g.length) return "";
    return '<div class="day"><h3>'+esc(h)+' <em>'+g.length+" sesi</em></h3>"+g.map(rowHtml).join("")+"</div>"}).join("");
}
function vRuang(){
  var js=S.d.jam, rs=S.d.ruang, l=S.d.jadwal.filter(function(r){return aktif(r)&&r.hari===S.rhari});
  var head='<div class="tool"><select onchange="S.rhari=this.value;vRuang()">'+S.d.hari.map(function(h){return '<option '+(h===S.rhari?"selected":"")+'>'+esc(h)+'</option>'}).join("")+'</select></div>';
  var t='<div class="scroll"><table><tr><th class="rn">Ruang</th>'+js.map(function(j){return '<th class="sj" title="Sesi '+j.ke+' · '+esc(j.waktu)+'">Sesi '+j.ke+'<br><small>'+esc(j.waktu)+'</small></th>'}).join("")+'</tr>';
  rs.forEach(function(r){
    t+='<tr><td class="rn">'+esc(r.gedung+" "+r.ruang)+'<br><small style="color:var(--mut)">kap. '+r.kap+'</small></td>';
    js.forEach(function(j){var x=l.filter(function(s){return s.ruang===r.ruang&&j.ke>=s.mulai&&j.ke<=s.selesai})[0];
      t+=x?'<td class="f" style="background:'+col(x.prodi)+'" title="'+esc(x.mk+" · "+x.prodi+" · "+x.dosen.join(", "))+'">'+esc(x.mk)+'</td>':"<td></td>"});
    t+="</tr>"});
  $("v-ruang").innerHTML=head+t+"</table></div>";
}

  // ---- isi ulang <select>: pertahankan pilihan bila masih valid ----
  function setO(i,a,pref,kosong,keep){
    var s=$(i), cur=s.value; a=a.slice();

  // mata kuliah: hanya yang BELUM/TIDAK masuk lewat Sebar Jadwal (Otomatis) untuk prodi terpilih

    S.d.mk.forEach(function(m){var k=String(m.nama).trim().toLowerCase(); if(m.prodi!==prodi||seen[k]||auto[k])return; seen[k]=1; out.push({v:m.nama,l:m.nama+(m.js?" · "+m.js+" JS":"")})});

function pjBuatXlsx(p){
  var m=pjMK().filter(function(x){return x.prodi===p}).sort(function(a,b){return (a.smt-b.smt)||String(a.nama).localeCompare(b.nama)});
  var head=["Program Studi","Semester Ke-","Mata Kuliah","SKS","JS","Pecah JS","Kelas","Peserta","Dosen Koordinator","Anggota 1","Anggota 2","Anggota 3"];
  var ws=XLSX.utils.aoa_to_sheet([head].concat(m.map(function(x){return [p,x.smt,x.nama,x.sks,x.js,"","","","","","",""]})));
  ws["!cols"]=[{wch:34},{wch:12},{wch:44},{wch:6},{wch:6},{wch:10},{wch:8},{wch:9},{wch:38},{wch:38},{wch:38},{wch:38}];
  var pt=XLSX.utils.aoa_to_sheet([["PETUNJUK PENGISIAN — "+p+" · "+S.ta+" · "+S.sem],[""],
    ["1. Isi kolom Kelas (mis. A), Peserta (angka), dan Dosen Koordinator pada sheet pertama. Anggota 1–3 bila ada tim pengampu."],
    ["2. Nama dosen harus SAMA PERSIS dengan sheet \"Daftar Dosen\" (salin-tempel)."],
    ["3. Satu mata kuliah dibuka untuk beberapa kelas: salin barisnya, lalu isi Kelas/Peserta/Dosen masing-masing."],
    ["4. Mata kuliah yang tidak dibuka semester ini: hapus barisnya."],
 ["    Kolom Pecah JS (opsional): kosongkan bila mata kuliah dijadwalkan sebagai satu blok. Isi mis. 3+2 untuk memecahnya menjadi dua pertemuan di hari berbeda. Hanya untuk JS minimal 4, jumlah bagian harus sama dengan JS (JS 5 = 3+2 atau 4+1), bilangan bulat, maksimal 2 bagian."],
    ["5. Jangan mengubah judul kolom, nama mata kuliah, dan jangan memindahkan sheet pertama. Simpan sebagai .xlsx lalu unggah lewat tombol Unggah Mata Kuliah (atau kirim ke Admin)."]]);
  pt["!cols"]=[{wch:120}];
  var dd=XLSX.utils.aoa_to_sheet([["Daftar Dosen"]].concat((S.d.dosen||[]).slice().sort().map(function(n){return [n]}))); dd["!cols"]=[{wch:60}];
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Jadwal"); XLSX.utils.book_append_sheet(wb,pt,"Petunjuk"); XLSX.utils.book_append_sheet(wb,dd,"Daftar Dosen");
  XLSX.writeFile(wb,pjFile(p)+".xlsx");
}
function pjParse(buf,prodi){
  var wb=XLSX.read(buf,{type:"array"}), ws=wb.Sheets[wb.SheetNames[0]], a=XLSX.utils.sheet_to_json(ws,{defval:"",raw:false});
  if(!a.length)throw new Error("Sheet pertama kosong.");
  var nk=function(o,n){var t=Object.keys(o).filter(function(k){return k.trim().toLowerCase()===n})[0];return t===undefined?"":String(o[t]).trim()};
  if(Object.keys(a[0]).map(function(k){return k.trim().toLowerCase()}).indexOf("mata kuliah")<0)throw new Error('Kolom "Mata Kuliah" tidak ditemukan. Gunakan file hasil unduhan dari aplikasi ini (data harus di sheet pertama).');
  var out=[],salah={};
  a.forEach(function(o){var mk=nk(o,"mata kuliah"); if(!mk)return;
    var ps=nk(o,"program studi"); if(ps&&ps!==prodi)salah[ps]=1;
    out.push({mk:mk,kelas:nk(o,"kelas"),peserta:nk(o,"peserta"),pecah:nk(o,"pecah js"),dosen:[nk(o,"dosen koordinator"),nk(o,"anggota 1"),nk(o,"anggota 2"),nk(o,"anggota 3")].filter(Boolean)})});
  if(Object.keys(salah).length)throw new Error("File ini berisi prodi lain ("+Object.keys(salah).join(", ")+"), padahal Anda mengunggah untuk "+prodi+".");
  return out;
}
function pjUnggah(i){
  if(!pjAdaXLSX())return;
  var p=PJ.pl[i], inp=document.createElement("input"); inp.type="file"; inp.accept=".xlsx,.xls";
  inp.onchange=function(){
    var f=inp.files[0]; if(!f)return;
    var fr=new FileReader();
    fr.onload=function(e){
      var rows; try{rows=pjParse(e.target.result,p)}catch(x){pjErr(p+": "+x.message);return}
      if(isTP()&&!confirm("Unggah Mata Kuliah hanya dapat dilakukan SATU KALI. Setelah berhasil, tombol Unggah hilang (hanya Admin yang dapat memulihkan). Pastikan isi file sudah benar. Lanjutkan?"))return;
      PJ.err=null; pjErr("Mengirim file "+p+"…");
      post({action:"rkUpload",prodi:p,ta:S.ta,sem:S.sem,rows:rows}).then(function(r){
        if(r.expired){S.user=S.token=null;render();return}
        if(r.ok){PJ.err=null;PJ.rk=null;toast(p+": "+r.jumlah+" kelas tersimpan");pjKuliah(true)}
        else pjErr(p+": "+r.error,r.daftar);
      }).catch(function(){pjErr("Gagal terhubung ke server.")});
    };
    fr.readAsArrayBuffer(f);
  };
  inp.click();
}
function pjUnduhHasil(){
  if(!pjAdaXLSX())return;
  var hi=function(h){return S.d.hari.indexOf(h)};
  var l=S.d.jadwal.filter(aktif).sort(function(a,b){return hi(a.hari)-hi(b.hari)||a.mulai-b.mulai||String(a.prodi).localeCompare(b.prodi)});
  var head=["Tahun Akademik","Semester","Program Studi","Semester Ke-","Hari","Jam Ke (Mulai)","Jam Ke (Selesai)","Jam Mulai","Jam Selesai","Ruang","Mata Kuliah","Kelas","Peserta","Dosen Koordinator","Anggota 1","Anggota 2","Anggota 3"];
  var rows=l.map(function(r){var w=waktu(r);return [r.ta,r.sem,r.prodi,r.smt||"",r.hari,r.mulai,r.selesai,w[0],w[1],r.ruang,r.mk,r.kelas,r.peserta,r.dosen[0]||"",r.dosen[1]||"",r.dosen[2]||"",r.dosen[3]||""]});
  var ws=XLSX.utils.aoa_to_sheet([head].concat(rows));
  ws["!cols"]=[12,9,32,11,9,12,13,10,11,8,42,7,9,34,30,30,30].map(function(w){return{wch:w}});
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Jadwal"); XLSX.writeFile(wb,"Jadwal_Kuliah_"+S.ta.replace("/","-")+"_"+S.sem+".xlsx");
}

function demoPost(b){
  if(/^(cfg|rk)/.test(b.action)) return Promise.resolve({ok:false,error:"Fitur ini memerlukan koneksi ke Apps Script (bukan mode demo)."});
  return new Promise(function(ok){setTimeout(function(){
    if(b.action==="login") return ok(b.email==="admin@example.com"&&b.password==="demo"?{ok:true,token:"demo",user:{nama:"Administrator",email:b.email,level:"super_admin",prodi:""}}:{ok:false,error:"Email atau password salah."});
    if(b.action==="logout") return ok({ok:true});
    if(b.action==="delete"){S.d.jadwal=S.d.jadwal.filter(function(r){return r.id!==b.id});return ok({ok:true})}
    var r=b.row, m=[]; if(!r.mk) return ok({ok:false,error:"Mata kuliah wajib diisi."});
    S.d.jadwal.forEach(function(x){if(x.id===r.id||x.ta!==r.ta||x.sem!==r.sem||x.hari!==r.hari||x.mulai>r.selesai||r.mulai>x.selesai)return;
      if(x.ruang===r.ruang)m.push("Ruang "+r.ruang+" dipakai: "+x.mk);x.dosen.forEach(function(d){if(r.dosen.indexOf(d)>-1)m.push("Dosen "+d+" mengajar: "+x.mk)})});
    if(m.length) return ok({ok:false,error:"Terdeteksi "+m.length+" bentrok.",bentrok:m});
    r.ta=S.ta;r.sem=S.sem; if(r.id) S.d.jadwal=S.d.jadwal.map(function(x){return x.id===r.id?r:x}); else{r.id="D"+Date.now();S.d.jadwal.push(r)}
    ok({ok:true})},300)});
}
