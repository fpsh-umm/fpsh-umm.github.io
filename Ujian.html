<script>
var CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzI8aoO-y2MvLk6SnOnv6kHe3ro6vfqPU7Ofgi65JxWQ1VogmSlLmQa0wJDt16q0NM2pg/exec",
  JUDUL_PERIODE: "Ujian Tengah Semester Ganjil 2026/2027",
  AUTO_REFRESH_MINUTES: 5
};
var $ = function (id) { return document.getElementById(id); };
var S = { data: [], jenis: "Semua", demo: false };
var HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
// Warna tulisan Program Studi pada kartu jadwal (dicocokkan lewat kata kunci pada nama prodi).
var PRODI_KELAS = [["pr-mat", /matematika/i], ["pr-bio", /biologi/i], ["pr-bind", /indonesia/i], ["pr-ppkn", /pancasila|kewarganegaraan|ppkn/i], ["pr-bing", /inggris/i], ["pr-pgsd", /guru sekolah dasar|pgsd/i], ["pr-kor", /kepelatihan|olahraga/i]];
function kelasProdi(p) { for (var i = 0; i < PRODI_KELAS.length; i++) if (PRODI_KELAS[i][1].test(p || "")) return PRODI_KELAS[i][0]; return ""; }
function sesiTag(r) { return r.sesi ? '<small class="sesi">Sesi ' + esc(r.sesi) + "</small>" : ""; }
function p2(n) { return ("0" + n).slice(-2); }
function iso(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }

function contoh() {
  var t = new Date(), s = [
    [0,"08:00","09:40","UTS","Algoritma dan Pemrograman","Dr. Ratna Sari, M.Pd","Budi Santoso, M.Si","Gedung Raya 3 R.301","A","Pendidikan Matematika","3","Tertulis","Bawa kartu ujian & KTM"],
    [0,"10:30","12:10","UTS","Biologi Sel","Sri Handayani, M.Si","Agus Wijaya, M.Pd","Lab Biologi 1","B","Pendidikan Biologi","1","Praktik",""],
    [1,"08:00","09:40","UTS","Psikologi Pendidikan","Prof. Hadi Nugroho, M.Pd","Rina Putri, M.Pd","Gedung Raya 4 R.402","A","Pendidikan Bahasa Inggris","3","Tertulis",""],
    [1,"13:00","14:40","UTS","Kalkulus Lanjut","Dr. Eko Prasetyo, M.Si","Dewi Lestari, M.Pd","Gedung Raya 3 R.305","C","Pendidikan Matematika","3","Daring","Via e-learning, kamera menyala"],
    [3,"09:00","10:40","UTS","Fisika Dasar","Dr. Maya Anggraini, M.Si","Fajar Ramadhan, M.Pd","Lab Fisika","A","Pendidikan IPA","1","Tertulis",""],
    [4,"08:00","09:40","UTS","Sastra Anak","Dra. Wulan Sari, M.Hum","Tia Rahma, M.Pd","Gedung Raya 4 R.410","A","Pendidikan Bahasa dan Sastra Indonesia","5","Tertulis",""]
  ];
  return s.map(function (r) { var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + r[0]);
    return { tanggal: iso(d), mulai: r[1], selesai: r[2], jenis: r[3], matkul: r[4], dosen: r[5], pengawas1: r[6], pengawas2: "Siti Aminah, M.Pd.", ruang: r[7], kelas: r[8], prodi: r[9], semester: r[10], metode: r[11], catatan: r[12] }; });
}

function prep(rows) {
  return rows.map(function (r) {
    r.start = new Date(r.tanggal + "T" + (r.mulai || "00:00") + ":00");
    r.end = new Date(r.tanggal + "T" + (r.selesai || r.mulai || "23:59") + ":00");
    return r;
  }).filter(function (r) { return !isNaN(r.start); }).sort(function (a, b) { return a.start - b.start; });
}
function status(r, now) { return now < r.start ? "Mendatang" : now <= r.end ? "Berlangsung" : "Selesai"; }

async function muat() {
  var ok = /^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL), b = $("banner");
  S.demo = false; b.hidden = true;
  if (ok && pengawasMode()) { // Pengawas: data diambil dari server hanya untuk tugasnya sendiri
    try {
      var jp = await post({ aksi: "jadwalSaya" });
      S.data = prep(jp.data); S.set = jp.pengaturan || {}; terapkanPengaturan(); $("upd").textContent = "Data diperbarui " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }) + " WIB";
      return isi();
    } catch (e) { if (!pengawasMode()) return; b.textContent = "Tidak dapat memuat jadwal tugas (" + e.message + ")."; b.hidden = false; S.data = []; return isi(); }
  }
  if (ok) {
    try {
      var r = await fetch(CONFIG.SCRIPT_URL + "?t=" + Date.now()), j = await r.json();
      if (!j.ok) throw new Error(j.error || "Gagal membaca data");
      S.data = prep(j.data); S.set = j.pengaturan || {}; terapkanPengaturan(); $("upd").textContent = "Data diperbarui " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }) + " WIB";
      return isi();
    } catch (e) { b.textContent = "Tidak dapat terhubung ke spreadsheet (" + e.message + "). Menampilkan data contoh."; }
  } else b.textContent = "Menampilkan data contoh. Sambungkan ke spreadsheet dengan mengisi CONFIG.SCRIPT_URL (lihat SETUP.md).";
  S.demo = true; b.hidden = false; S.data = prep(contoh()); S.set = {}; terapkanPengaturan(); $("upd").textContent = ""; isi();
}

function uniq(a) { return a.filter(function (v, i) { return v && a.indexOf(v) === i; }).sort(); }
function isi() {
  var cp = $("prodi").value, ck = $("kelas").value;
  $("prodi").innerHTML = '<option value="">Semua program studi</option>' + uniq(S.data.map(function (r) { return r.prodi; })).map(function (v) { return "<option>" + esc(v) + "</option>"; }).join("");
  $("prodi").value = cp;
  var kl = S.data.filter(function (r) { return !$("prodi").value || r.prodi === $("prodi").value; });
  $("kelas").innerHTML = '<option value="">Semua kelas</option>' + uniq(kl.map(function (r) { return r.kelas; })).map(function (v) { return "<option>" + esc(v) + "</option>"; }).join("");
  $("kelas").value = ck;
  gambar();
}

function gambar() {
  var q = $("q").value.toLowerCase().trim(), now = new Date(), tampil = $("selesai").checked, hari = iso(now);
  var rows = S.data.filter(function (r) {
    if (!pengawasMode() && S.jenis !== "Semua" && r.jenis !== S.jenis) return false;
    if ($("prodi").value && r.prodi !== $("prodi").value) return false;
    if ($("kelas").value && r.kelas !== $("kelas").value) return false;
    if ($("smt").value && parseInt(r.semester, 10) !== Number($("smt").value)) return false;
    if (!tampil && status(r, now) === "Selesai") return false;
    if (!pengawasMode() && $("saya").checked && AUTH.user && !milikSaya(r)) return false;
    return !q || [r.matkul, r.dosen, r.pengawas1, r.pengawas2, r.ruang, r.kelas, r.prodi].join(" ").toLowerCase().indexOf(q) >= 0;
  });
  S.view = rows;
  if (!rows.length) { $("chips").innerHTML = ""; $("list").innerHTML = '<div class="kosong"><div style="font-size:2.4rem">🗓️</div>' + (pengawasMode() ? "Belum ada jadwal pengawasan atas nama Anda." : "Tidak ada jadwal ujian yang cocok.") + "</div>"; return; }
  var g = {}, h = "";
  rows.forEach(function (r) { (g[r.tanggal] = g[r.tanggal] || []).push(r); });
  Object.keys(g).sort().forEach(function (k) {
    var d = new Date(k + "T00:00:00");
    h += '<div class="day' + (k === hari ? " today" : "") + '" id="d-' + k + '"><h2>' + HARI[d.getDay()] + ", " + d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }) + "</h2><span>" + (k === hari ? "Hari ini · " : "") + g[k].length + (pengawasMode() ? " tugas" : " ujian") + "</span></div><div class='grid'>";
    g[k].forEach(function (r) {

  while ((m = re.exec(l))) {
    var s = m[0], pop = m[1] ? "tatib" : m[2] ? "pakaian" : "", t = "";
    if (m[3]) { t = s.match(/[.,;:!?)\]]+$/); t = t ? t[0] : ""; s = s.slice(0, s.length - t.length); }
    out += esc(l.slice(i, m.index));
    out += pop ? '<a class="lk" href="#" data-pop="' + pop + '">' + esc(s) + "</a>" : '<a class="lk" href="' + esc(s) + '" target="_blank" rel="noopener noreferrer">' + esc(s) + "</a>";
    out += esc(t); i = m.index + m[0].length;
  }
  return out + esc(l.slice(i));
}

function barisPengumuman(txt) {
  return String(txt || "").split(/\r?\n/).map(function (l) {
    l = l.trim(); if (!l) return "";
    var m = l.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*(.*)$/u), ic;
    if (m) { ic = '<span class="ic em">' + esc(m[1]) + "</span>"; l = m[2]; } else ic = ikonSvg(pilihIkon(l));
    return '<div class="ir">' + ic + '<span class="tx">' + teksPengumuman(l) + "</span></div>";
  }).join("");
}

  var bottomMargin = Math.max(footerH, contFooterH) + 6, contTop = 14, contentBottom = PH - bottomMargin, y = headerH + 6;

  doc.setFont("helvetica", "bold"); doc.setFontSize(13);
  doc.text(pw ? "JADWAL TUGAS PENGAWASAN" : "JADWAL UJIAN", PW / 2, y, { align: "center" }); y += 6;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10);
  var sub = s.tahun_akademik ? (s.jenis_ujian === "UAS" ? "Ujian Akhir Semester " : "Ujian Tengah Semester ") + (s.semester || "") + " " + s.tahun_akademik : CONFIG.JUDUL_PERIODE;
  doc.text(sub, PW / 2, y, { align: "center" }); y += 7;

  var f = [];
  if (pw) f.push("Pengawas: " + AUTH.user.nama);
  else {
    if (S.jenis !== "Semua") f.push("Jenis: " + S.jenis);
    if ($("prodi").value) f.push("Program Studi: " + $("prodi").value);
    if ($("smt").value) f.push("Semester: " + $("smt").value);
    if ($("kelas").value) f.push("Kelas: " + $("kelas").value);
    if ($("q").value.trim()) f.push('Pencarian: "' + $("q").value.trim() + '"');
    if (!f.length) f.push("Semua program studi");
  }
  doc.setFontSize(9); doc.setTextColor(90);
  doc.text(f.join("   |   "), mx, y);
  doc.text("Dicetak: " + new Date().toLocaleString("id-ID"), PW - mx, y, { align: "right" });
  doc.setTextColor(0); y += 5;

  var body = rows.map(function (r, i) {
    var d = new Date(r.tanggal + "T00:00:00");
    var jr = HARI[d.getDay()] + ", " + p2(d.getDate()) + "/" + p2(d.getMonth() + 1) + "/" + d.getFullYear() + "\n" + (r.mulai || "--:--") + "-" + (r.selesai || "--:--") + (r.ruang ? "\n" + r.ruang : "");
    if (pw) return [String(i + 1), r.matkul || "Tanpa nama", jr];
    var pg = [r.pengawas1 ? "1. " + r.pengawas1 : "", r.pengawas2 ? "2. " + r.pengawas2 : ""].filter(Boolean).join("\n");
    return [String(i + 1), r.matkul || "Tanpa nama", jr, r.prodi || "-", (r.semester || "-") + " / " + (r.kelas || "-"), r.dosen || "-", pg || "-"];
  });
  doc.autoTable({
    startY: y + 2,
    margin: { left: mx, right: mx, top: contTop, bottom: bottomMargin },
    head: [pw ? ["No.", "Mata Kuliah", "Hari/Tanggal\nJam/Ruang"] : ["No.", "Mata Kuliah", "Hari/Tanggal\nJam/Ruang", "Program Studi", "Smt/Kls", "Dosen", "Pengawas"]],
    body: body, theme: "grid",
    styles: { font: "helvetica", fontSize: 8, cellPadding: 2, valign: "middle", overflow: "linebreak" },
    headStyles: { fillColor: [44, 54, 139], textColor: 255, fontStyle: "bold", halign: "center" }, // biru #2C368B (tema aplikasi)
    alternateRowStyles: { fillColor: [244, 246, 252] },
    columnStyles: pw ? { 0: { cellWidth: 9, halign: "center" }, 1: { cellWidth: "auto" }, 2: { cellWidth: 60 } }
      : { 0: { cellWidth: 9, halign: "center" }, 1: { cellWidth: "auto" }, 2: { cellWidth: 32 }, 3: { cellWidth: 30 }, 4: { cellWidth: 15, halign: "center" }, 5: { cellWidth: 30 }, 6: { cellWidth: 31 } },
    didDrawCell: function (data) { if (data.section === "head") { doc.setFillColor(4, 165, 79); doc.rect(data.cell.x, data.cell.y + data.cell.height - 0.8, data.cell.width, 0.8, "F"); } }, // garis hijau #04A54F di bawah header
    didDrawPage: function (data) { if (data.pageNumber > 1) kopLanjutan(); }
  });

  var sigY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : y + 10) + 14;
  if (sigY + 50 > contentBottom) { doc.addPage(F4_FORMAT, "p"); kopLanjutan(); sigY = contTop + 6; }
  var sx = PW - mx, qr = 20, qy = sigY + 9;
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(0);
  doc.text(TTD.kota + ", " + new Date().toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }), sx, sigY, { align: "right" });
  doc.text(TTD.an, sx, sigY + 6, { align: "right" });
  doc.addImage(QR_WADEK_DATA_URI, "PNG", sx - qr, qy, qr, qr);
  doc.setFont("helvetica", "bold"); doc.text(TTD.nama, sx, qy + qr + 4, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.text(TTD.jabatan, sx, qy + qr + 10, { align: "right" });

  var url = doc.output("bloburl");
  if (w) w.location.href = url; else doc.save("Jadwal_Ujian.pdf"); // pop-up diblokir → unduh langsung
}
</script>
</body>
</html>
