<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal Ujian — FPSH Universitas Muhammadiyah Malang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2c368b;--navy2:#232c70;--green:#04a54f;--greenD:#038a41;--err:#c4202e;--bg:#eef1f8;--card:#fff;--ink:#141a33;--mut:#5d6585;--line:#dde2f0;--ok:#04a54f;--warn:#f2a900;--tint-uts:#e4e7f5;--tint-uas:#dff3e8}
:root[data-theme=dark]{--bg:#0b1020;--card:#151c36;--ink:#eaeefc;--mut:#9aa4cb;--line:#262f55;--tint-uts:#222a66;--tint-uas:#0f3a25}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,.num{font-family:Oswald,Impact,sans-serif}
a{color:inherit}button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
.bar{background:#fff;border-bottom:4px solid var(--green)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px}
.bar img{display:block}.umm{height:46px}.fpsh{height:38px}
.hero{background:var(--navy);color:#fff;padding:44px 0 90px;background-image:radial-gradient(circle at 92% 8%,rgba(4,165,79,.55),transparent 38%)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:end}
.hero h1{font-size:clamp(3.2rem,9vw,6.4rem);line-height:.92;letter-spacing:.5px;font-weight:700}
.hero p{margin-top:14px;max-width:46ch;color:#c9d1f3}
.cd{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:18px 20px;backdrop-filter:blur(6px)}
.cd small{color:#c9d1f3;display:block;margin-bottom:6px}
.cd b{display:block;font-size:1.05rem;margin-bottom:12px}
.units{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.units div{background:#fff;color:var(--navy);border-radius:12px;padding:8px 0}
.units .num{font-size:2rem;line-height:1.1;display:block}.units span{font-size:.7rem;color:var(--mut)}
.cd .hr{font-family:Oswald,Impact,sans-serif;font-size:2.4rem;line-height:1;font-weight:600;margin:0}
.cd .tg{font-size:1.1rem;color:#c9d1f3;margin:4px 0 14px}
.cd .jm{font-size:3.2rem;line-height:1;background:#fff;color:var(--navy);border-radius:14px;padding:8px 16px;display:inline-block}
.cd .jm span{font-size:1.8rem;color:var(--green)}
.live{background:var(--green)!important;color:#fff!important}.live span{color:#d6f5e3!important}
.tools{margin-top:-52px;position:relative}
.panel{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 14px 40px rgba(44,54,139,.18);display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--navy);color:#fff}
.f{flex:1;min-width:150px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.btn{border:1.5px solid var(--line);background:var(--card);padding:9px 14px;border-radius:12px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--navy2)}
.chk{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--mut)}
.banner{margin:18px 0 0;background:#fff4d6;color:#6b4b00;border:1px solid #f2d27a;padding:10px 14px;border-radius:12px;font-size:.9rem}
.day{margin:34px 0 12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.day h2{font-size:1.6rem;font-weight:600;letter-spacing:.3px}.day span{color:var(--mut);font-size:.9rem}
.day.today h2{color:var(--greenD)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.card{background:var(--card);border-radius:18px;display:grid;grid-template-columns:92px 1fr;overflow:hidden;border:1px solid var(--line)}
.card.selesai{opacity:.55}
.t{background:var(--tint-uts);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;text-align:center}
.card.UAS .t{background:var(--tint-uas)}
.t .num{font-size:1.7rem;line-height:1}.t small{color:var(--mut);font-size:.75rem;margin-top:4px}
.b{padding:14px 16px;display:grid;gap:6px}
.b h3{font-size:1.05rem;line-height:1.3}
.m{font-size:.85rem;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 14px}
.tag{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--tint-uts);color:var(--navy2)}
.UAS .tag.j{background:var(--tint-uas);color:var(--greenD)}
:root[data-theme=dark] .tag{color:#fff}
.st-Berlangsung{background:var(--green)!important;color:#fff!important}.st-Selesai{background:var(--line)!important;color:var(--mut)!important}
.st{display:inline-flex;align-items:center}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;margin-right:6px}
.st-Mendatang{background:#e4e7f5!important;color:#2c368b!important}
:root[data-theme=dark] .st-Mendatang{background:#222a66!important;color:#b4bfff!important}
.st-Berlangsung::before{animation:pls 1.2s ease-in-out infinite}
@keyframes pls{50%{opacity:.25}}
.card.s-Berlangsung{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.card.s-Mendatang .t{box-shadow:inset 4px 0 0 var(--navy)}
.card.s-Berlangsung .t{box-shadow:inset 4px 0 0 var(--green)}
.cat{font-size:.8rem;font-weight:600;border:0;background:none;color:var(--navy2);cursor:pointer;padding:0;justify-self:start;text-decoration:underline}
:root[data-theme=dark] .cat{color:#9db0ff}
[hidden]{display:none!important}
dialog{border:0;border-radius:20px;padding:20px;width:min(560px,94vw);max-height:min(90vh,calc(100dvh - 24px));overflow:auto;overscroll-behavior:contain;margin:auto;inset:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,40,.6)}dialog h3{font-family:Oswald,sans-serif;font-size:1.5rem;margin-bottom:12px}
dialog.lg{padding:0;border-radius:26px;width:min(440px,94vw);overflow:hidden;box-shadow:0 24px 60px rgba(10,15,40,.45)}dialog.lg[open]{display:flex;flex-direction:column}dialog.lg::before{content:"";display:block;flex:none;height:14px;background:linear-gradient(90deg,#2c368b 0,#2c368b 50%,#04a54f 50%,#04a54f 100%)}
.lg .in{padding:16px 26px 26px;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.lg .x{position:absolute;right:12px;top:24px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;font-size:1.1rem;color:var(--mut)}
.lg .logo{display:block;margin:4px auto 8px;height:88px;max-width:70%;object-fit:contain}
.lg h3{text-align:center;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:1.5rem;margin:0}
.lg .sub{text-align:center;color:var(--greenD);font-weight:700;margin:6px 0 18px}
:root[data-theme=dark] .lg .sub{color:#4fd68b}:root[data-theme=dark] .lg .tabs .on,:root[data-theme=dark] .lg .alt{color:#b4bfff}:root[data-theme=dark] .lg .alt{border-color:#b4bfff}
.lg .tabs{display:flex;gap:4px;background:var(--bg);border-radius:16px;padding:6px;margin-bottom:18px}
.lg .tabs button{flex:1;border:0;background:none;border-radius:12px;padding:12px 2px;font-weight:700;font-size:.82rem;color:var(--mut);cursor:pointer;line-height:1.2}
.lg .tabs .on{background:var(--card);color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lg label.l{display:block;font-size:.78rem;font-weight:800;letter-spacing:.3px;margin:0 0 6px;text-transform:uppercase}
.lg .ip{position:relative;margin-bottom:14px}.lg .ip svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;fill:#9aa4cb}
.lg .ip input,.lg .ip select{width:100%;padding:14px 14px 14px 46px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.lg .cek{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;padding:8px 14px;cursor:pointer}.lg .has-cek input{padding-right:84px}.lg .found{background:var(--tint-uts);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:.88rem;line-height:1.5;word-break:break-word}.lg .found b{display:block;font-size:.98rem}.lg .big:disabled{opacity:.5;cursor:not-allowed}
.lg .hint{font-size:.8rem;color:var(--mut);margin:-6px 0 14px}
.lg .big{width:100%;border:0;border-radius:14px;background:var(--navy);color:#fff;font-weight:800;font-size:1.05rem;padding:15px;cursor:pointer;box-shadow:0 8px 18px rgba(44,54,139,.3)}.lg .big:hover{background:var(--navy2)}
.lg .alt{width:100%;margin-top:12px;border:1.5px solid var(--navy);background:none;color:var(--navy);border-radius:14px;padding:13px;font-weight:700;cursor:pointer}
dialog h4{margin:18px 0 8px}.fld{display:grid;gap:4px;margin-bottom:10px;font-size:.85rem;color:var(--mut)}.fld .f{width:100%}
html:has(dialog[open]){overflow:hidden}
@media(max-width:480px){.lg .in{padding:14px 18px 22px}.lg .logo{height:72px}.lg .tabs button{font-size:.76rem}}
@media(max-height:680px){.lg .logo{height:56px;margin-bottom:4px}.lg h3{font-size:1.25rem}.lg .sub{margin-bottom:12px}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.err{color:var(--err);font-size:.85rem;min-height:1.2em;margin-bottom:8px}.ok{color:var(--ok)}
dialog.wide{width:min(900px,96vw)}.pw{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.pw .pt{font-size:.92rem;margin-bottom:8px}.pw .pt span{color:var(--mut);font-size:.8rem}.bk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.85rem}.bk .st2{flex:1;min-width:150px;word-break:break-word}.bk .st2.err{margin:0;min-height:0}.bk label.btn{display:inline-flex;align-items:center}
.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.sm{padding:6px 10px;min-height:36px!important}.ut{width:100%;font-size:.82rem;border-collapse:collapse}.ut td{padding:6px 4px;border-bottom:1px solid var(--line)}
.pw #seg,.pw #prodi,.pw #kelas,.pw #sayaWrap{display:none!important}
.kosong{text-align:center;padding:60px 0;color:var(--mut)}
footer{margin:50px 0 30px;text-align:center;color:var(--mut);font-size:.85rem}
input,select{font-size:16px}.card,.b h3,.m,.t{overflow-wrap:anywhere}
.chips{position:sticky;top:0;z-index:20;background:var(--bg);margin:14px -18px 0;padding:8px 18px;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:6px 10px;min-width:58px;cursor:pointer;text-align:center;line-height:1.15}
.chip b{display:block;font-family:Oswald,sans-serif;font-size:1.2rem}.chip small{display:block;font-size:.68rem;color:var(--mut)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}.chip.on small{color:#c9d1f3}
.day{scroll-margin-top:84px}#ftoggle{display:none}
.top{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:0;background:var(--green);color:#fff;font-size:1.3rem;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;z-index:30}
.top[hidden]{display:none}
@media(max-width:780px){
.wrap{padding:0 14px}.bar .wrap{padding:8px 14px}.umm{height:38px}.fpsh{height:28px}
.hero .wrap{grid-template-columns:1fr;gap:20px}.hero{padding:24px 0 66px}.hero h1{font-size:3.4rem}.hero p{font-size:.9rem;margin-top:10px}
.cd{padding:14px;border-radius:16px}.cd .hr{font-size:2rem}.cd .jm{font-size:2.6rem}
.tools{margin-top:-42px}.panel{padding:12px;border-radius:16px}
.seg{width:100%}.seg button{flex:1}.btn,.seg button{min-height:44px}
#ftoggle{display:inline-flex;align-items:center}.fil{display:none}.fil.open{display:flex}.fil .f{min-width:100%}
.chips{margin:12px -14px 0;padding:8px 14px}
.day{margin:22px 0 10px}.day h2{font-size:1.3rem}
.grid{gap:12px}.card{grid-template-columns:1fr}
.t{flex-direction:row;justify-content:flex-start;align-items:baseline;gap:8px;padding:8px 14px}.t .num{font-size:1.4rem}.t small{margin:0}
.b{padding:12px 14px}.cat{min-height:44px;display:flex;align-items:center}
}
@media print{.chips,.top,.bar,.hero,.tools,.banner,footer,.cat{display:none}body{background:#fff}.card{break-inside:avoid}.card.selesai{opacity:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
var CONFIG = {
  SCRIPT_URL: "https://script.google.com/macros/s/AKfycbzI8aoO-y2MvLk6SnOnv6kHe3ro6vfqPU7Ofgi65JxWQ1VogmSlLmQa0wJDt16q0NM2pg/exec",
  JUDUL_PERIODE: "Ujian Tengah Semester Ganjil 2026/2027",
  AUTO_REFRESH_MINUTES: 5
};
var $ = function (id) { return document.getElementById(id); };
var S = { data: [], jenis: "Semua", demo: false };
var HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
function p2(n) { return ("0" + n).slice(-2); }
function iso(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }

function contoh() {
  var t = new Date(), s = [
    [0,"08:00","09:40","UTS","Algoritma dan Pemrograman","Dr. Ratna Sari, M.Pd","Budi Santoso, M.Si","Gedung Raya 3 R.301","A","Pendidikan Matematika","3","Tertulis","Bawa kartu ujian & KTM"],
    [0,"10:30","12:10","UTS","Biologi Sel","Sri Handayani, M.Si","Agus Wijaya, M.Pd","Lab Biologi 1","B","Pendidikan Biologi","1","Praktik",""],
    [1,"08:00","09:40","UTS","Psikologi Pendidikan","Prof. Hadi Nugroho, M.Pd","Rina Putri, M.Pd","Gedung Raya 4 R.402","A","Pendidikan Bahasa Inggris","3","Tertulis",""],
    [1,"13:00","14:40","UTS","Kalkulus Lanjut","Dr. Eko Prasetyo, M.Si","Dewi Lestari, M.Pd","Gedung Raya 3 R.305","C","Pendidikan Matematika","3","Daring","Via e-learning, kamera menyala"],
    [3,"09:00","10:40","UTS","Fisika Dasar","Dr. Maya Anggraini, M.Si","Fajar Ramadhan, M.Pd","Lab Fisika","A","Pendidikan IPA","1","Tertulis",""],
    [4,"08:00","09:40","UTS","Sastra Anak","Dra. Wulan Sari, M.Hum","Tia Rahma, M.Pd","Gedung Raya 4 R.410","A","Pendidikan Bahasa dan Sastra Indonesia","5","Tertulis",""]
  ];
  return s.map(function (r) { var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + r[0]);
    return { tanggal: iso(d), mulai: r[1], selesai: r[2], jenis: r[3], matkul: r[4], dosen: r[5], pengawas1: r[6], pengawas2: "Siti Aminah, M.Pd.", ruang: r[7], kelas: r[8], prodi: r[9], semester: r[10], metode: r[11], catatan: r[12] }; });
}

function prep(rows) {
  return rows.map(function (r) {
    r.start = new Date(r.tanggal + "T" + (r.mulai || "00:00") + ":00");
    r.end = new Date(r.tanggal + "T" + (r.selesai || r.mulai || "23:59") + ":00");
    return r;
  }).filter(function (r) { return !isNaN(r.start); }).sort(function (a, b) { return a.start - b.start; });
}
function status(r, now) { return now < r.start ? "Mendatang" : now <= r.end ? "Berlangsung" : "Selesai"; }

async function muat() {
  var ok = /^https:\/\/script\.google\.com\//.test(CONFIG.SCRIPT_URL), b = $("banner");
  S.demo = false; b.hidden = true;
  if (ok && pengawasMode()) { // Pengawas: data diambil dari server hanya untuk tugasnya sendiri
    try {
      var jp = await post({ aksi: "jadwalSaya" });
      S.data = prep(jp.data); S.set = jp.pengaturan || {}; terapkanPengaturan(); $("upd").textContent = "Data diperbarui " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }) + " WIB";
      return isi();
    } catch (e) { if (!pengawasMode()) return; b.textContent = "Tidak dapat memuat jadwal tugas (" + e.message + ")."; b.hidden = false; S.data = []; return isi(); }
  }
  if (ok) {
    try {
      var r = await fetch(CONFIG.SCRIPT_URL + "?t=" + Date.now()), j = await r.json();
      if (!j.ok) throw new Error(j.error || "Gagal membaca data");
      S.data = prep(j.data); S.set = j.pengaturan || {}; terapkanPengaturan(); $("upd").textContent = "Data diperbarui " + new Date().toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" }) + " WIB";
      return isi();
    } catch (e) { b.textContent = "Tidak dapat terhubung ke spreadsheet (" + e.message + "). Menampilkan data contoh."; }
  } else b.textContent = "Menampilkan data contoh. Sambungkan ke spreadsheet dengan mengisi CONFIG.SCRIPT_URL (lihat SETUP.md).";
  S.demo = true; b.hidden = false; S.data = prep(contoh()); S.set = {}; terapkanPengaturan(); $("upd").textContent = ""; isi();
}

function uniq(a) { return a.filter(function (v, i) { return v && a.indexOf(v) === i; }).sort(); }
function isi() {
  var cp = $("prodi").value, ck = $("kelas").value;
  $("prodi").innerHTML = '<option value="">Semua program studi</option>' + uniq(S.data.map(function (r) { return r.prodi; })).map(function (v) { return "<option>" + esc(v) + "</option>"; }).join("");
  $("prodi").value = cp;
  var kl = S.data.filter(function (r) { return !$("prodi").value || r.prodi === $("prodi").value; });
  $("kelas").innerHTML = '<option value="">Semua kelas</option>' + uniq(kl.map(function (r) { return r.kelas; })).map(function (v) { return "<option>" + esc(v) + "</option>"; }).join("");
  $("kelas").value = ck;
  gambar();
}

function gambar() {
  var q = $("q").value.toLowerCase().trim(), now = new Date(), tampil = $("selesai").checked, hari = iso(now);
  var rows = S.data.filter(function (r) {
    if (!pengawasMode() && S.jenis !== "Semua" && r.jenis !== S.jenis) return false;
    if ($("prodi").value && r.prodi !== $("prodi").value) return false;
    if ($("kelas").value && r.kelas !== $("kelas").value) return false;
    if (!tampil && status(r, now) === "Selesai") return false;
    if (!pengawasMode() && $("saya").checked && AUTH.user && !milikSaya(r)) return false;
    return !q || [r.matkul, r.dosen, r.pengawas1, r.pengawas2, r.ruang, r.kelas, r.prodi].join(" ").toLowerCase().indexOf(q) >= 0;
  });
  if (!rows.length) { $("chips").innerHTML = ""; $("list").innerHTML = '<div class="kosong"><div style="font-size:2.4rem">🗓️</div>' + (pengawasMode() ? "Belum ada jadwal pengawasan atas nama Anda." : "Tidak ada jadwal ujian yang cocok.") + "</div>"; return; }
  var g = {}, h = "";
  rows.forEach(function (r) { (g[r.tanggal] = g[r.tanggal] || []).push(r); });
  Object.keys(g).sort().forEach(function (k) {
    var d = new Date(k + "T00:00:00");
    h += '<div class="day' + (k === hari ? " today" : "") + '" id="d-' + k + '"><h2>' + HARI[d.getDay()] + ", " + d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }) + "</h2><span>" + (k === hari ? "Hari ini · " : "") + g[k].length + (pengawasMode() ? " tugas" : " ujian") + "</span></div><div class='grid'>";
    g[k].forEach(function (r) {
      var st = status(r, now), i = S.data.indexOf(r);
      if (pengawasMode()) { // tampilan Pengawas: hanya kapan, di mana, dan mata kuliah
        h += '<article class="card s-' + st + (st === "Selesai" ? " selesai" : "") + '"><div class="t"><span class="num">' + esc(r.mulai) + "</span><small>s.d. " + esc(r.selesai) + '</small></div><div class="b"><div class="m"><span class="tag j">Tugas Pengawas</span><span class="tag st st-' + st + '">' + st + "</span></div><h3>" + esc(r.matkul) + '</h3><div class="m"><span>📍 ' + esc(r.ruang) + '</span></div></div></article>';
        return;
      }
      h += '<article class="card ' + esc(r.jenis) + (st === "Selesai" ? " selesai" : "") + " s-" + st + '"><div class="t"><span class="num">' + esc(r.mulai) + "</span><small>s.d. " + esc(r.selesai) + '</small></div><div class="b">' +

  try {

    r.pengawas1 = j.pengawas1; r.pengawas2 = j.pengawas2; $("w1_" + b).value = j.pengawas1; $("w2_" + b).value = j.pengawas2;
    e.className = "err ok"; e.textContent = kosong ? "✓ Dikosongkan" : "✓ Tersimpan"; gambar();
  } catch (x) {
    var bentrok = /^BENTROK:/.test(x.message), msg = x.message.replace(/^BENTROK:\s*/, "");
    if (bentrok && confirm(msg + "\n\nTetap simpan?")) return simpanPlot(b, true, kosong);
    e.className = "err"; e.textContent = msg;
  }
}
function hapusPlot(b) { if (confirm("Kosongkan Pengawas I dan II pada jadwal ini?")) simpanPlot(b, true, true); }

// ---------- Upload Soal & Kunci/Jawaban (Dosen) ----------
var BK = [];
function ukr(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
function milikDosen(r) { return !!AUTH.user && String(r.dosen || "").toLowerCase().indexOf(AUTH.user.nama.toLowerCase()) >= 0; }
function formBerkas() {
  $("bB").innerHTML = '<div class="hint" style="margin:0 0 10px">Unggah soal dan kunci/jawaban untuk mata kuliah yang Anda ampu. Format PDF, DOC, DOCX, XLS, XLSX, atau ZIP (maks. 7 MB). Mengunggah ulang akan mengganti berkas sebelumnya.</div><div id="bl">Memuat…</div><button type="button" class="btn" onclick="tutup()">Tutup</button>';
}
async function muatBerkas() {
  try { BK = (await post({ aksi: "daftarBerkas" })).data; } catch (x) { BK = []; $("bl").textContent = x.message; return; }
  gambarBerkas();
}
function gambarBerkas() {
  var rows = S.data.filter(function (r) { return r.kunci && milikDosen(r); });
  if (!rows.length) { $("bl").textContent = S.demo ? "Sedang menampilkan data contoh. Sambungkan aplikasi ke spreadsheet terlebih dahulu." : "Belum ada jadwal ujian atas nama Anda. Pastikan nama akun sama dengan nama pada kolom Dosen di jadwal."; return; }
  $("bl").innerHTML = rows.map(function (r) {
    return '<div class="pw"><div class="pt"><b>' + esc(r.matkul) + "</b> · " + esc(r.jenis) + " · Kelas " + esc(r.kelas) + " · " + esc(r.prodi) + "<br><span>" + fmtT(r.tanggal) + " · " + esc(r.mulai) + "–" + esc(r.selesai) + "</span></div>" +
      ["soal", "kunci"].map(function (j) {
        var f = BK.filter(function (x) { return x.kunci === r.kunci && x.jenis === j; })[0];
        return '<div class="bk"><b style="min-width:100px">' + (j === "soal" ? "Soal" : "Kunci / Jawaban") + '</b><span class="st2" id="bs_' + r.baris + j + '">' + (f ? "✓ " + esc(f.namaFile) + " (" + ukr(f.ukuran) + ") · " + esc(f.diunggah) : "Belum diunggah") + "</span>" +
          '<label class="btn sm">' + (f ? "Ganti" : "Unggah") + '<input type="file" hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.zip" onchange="unggah(this,' + r.baris + ',\'' + j + '\')"></label>' +
          (f ? ' <button type="button" class="btn sm" onclick="hapusBerkas(' + r.baris + ',\'' + j + '\')">Hapus</button>' : "") + "</div>";
      }).join("") + "</div>";
  }).join("");
}
async function unggah(inp, b, j) {
  var f = inp.files[0], r = S.data.filter(function (x) { return x.baris === b; })[0], st = $("bs_" + b + j); inp.value = "";
  if (!f || !r || !st) return;
  if (f.size > 7 * 1024 * 1024) { st.className = "st2 err"; st.textContent = "Ukuran berkas maksimal 7 MB."; return; }
  if (!/\.(pdf|docx?|xlsx?|zip)$/i.test(f.name)) { st.className = "st2 err"; st.textContent = "Format harus PDF, DOC, DOCX, XLS, XLSX, atau ZIP."; return; }
  st.className = "st2"; st.textContent = "Mengunggah " + f.name + "…";
  try {
    var data = await new Promise(function (res, rej) { var fr = new FileReader(); fr.onload = function () { res(String(fr.result).split(",")[1] || ""); }; fr.onerror = function () { rej(new Error("Gagal membaca berkas.")); }; fr.readAsDataURL(f); });
    BK = (await post({ aksi: "unggahBerkas", baris: b, kunci: r.kunci, jenis: j, nama: f.name, data: data })).data;
    gambarBerkas();
  } catch (x) { st.className = "st2 err"; st.textContent = x.message; }
}
async function hapusBerkas(b, j) {
  var r = S.data.filter(function (x) { return x.baris === b; })[0], st = $("bs_" + b + j);
  if (!r || !confirm("Hapus berkas " + (j === "soal" ? "soal" : "kunci/jawaban") + " untuk " + r.matkul + "?")) return;
  try { BK = (await post({ aksi: "hapusBerkas", kunci: r.kunci, jenis: j })).data; gambarBerkas(); } catch (x) { if (st) { st.className = "st2 err"; st.textContent = x.message; } }
}

var UDATA = [];
function tabelUser(d) {
  UDATA = d;
  $("pu").innerHTML = '<table class="ut">' + d.map(function (u) {
    return "<tr><td><b>" + esc(u.username) + "</b><br>" + esc(u.nama) + "</td><td>" + esc(u.peran) + (u.status === "YA" ? "" : u.status === "MENUNGGU" ? " (menunggu)" : " (nonaktif)") + (u.prodi ? "<br>" + esc(u.prodi) + " " + esc(u.kelas) : "") + '</td><td style="white-space:nowrap"><button class="btn sm" onclick="editUser(\'' + esc(u.username) + '\')">Edit</button> <button class="btn sm" onclick="hapusUser(\'' + esc(u.username) + '\')">Hapus</button></td></tr>';
  }).join("") + "</table>";
}
async function muatUser() { try { tabelUser((await post({ aksi: "daftarPengguna" })).data); } catch (x) { $("pu").textContent = x.message; } }
function batalEdit() {
  $("uf").reset(); $("uu").readOnly = false; $("ue").textContent = ""; $("ubt").hidden = true;
  $("uj").textContent = "Tambah pengguna"; $("usv").textContent = "Tambah"; $("uw").required = true; $("uw").placeholder = "8 digit, mis. 02091988";
}
function editUser(un) {
  var u = UDATA.filter(function (x) { return x.username === un; })[0]; if (!u) return;
  $("uu").value = u.username; $("uu").readOnly = true; $("un").value = u.nama; $("up").value = u.peran; $("ust").value = u.status; $("upr").value = u.prodi || ""; $("ukl").value = u.kelas || "";
  $("uw").value = ""; $("uw").required = false; $("uw").placeholder = "kosong = tidak diubah";
  $("uj").textContent = "Edit pengguna: " + u.username; $("usv").textContent = "Simpan perubahan"; $("ubt").hidden = false; $("ue").textContent = "";
  $("uf").scrollIntoView({ behavior: "smooth", block: "nearest" });
}
async function simpanUser(e) {
  e.preventDefault(); $("ue").textContent = "";
  var edit = $("uu").readOnly, un = $("uu").value.trim().toLowerCase();
  if (!edit && UDATA.some(function (x) { return x.username.toLowerCase() === un; })) { $("ue").textContent = "Username sudah ada. Gunakan tombol Edit pada daftar."; return false; }
  try {
    tabelUser((await post({ aksi: "simpanPengguna", username: un, nama: $("un").value, peran: $("up").value, password: $("uw").value, status: $("ust").value, prodi: $("upr").value, kelas: $("ukl").value })).data);
    batalEdit(); $("ue").className = "err ok"; $("ue").textContent = edit ? "Perubahan tersimpan." : "Pengguna ditambahkan.";
  } catch (x) { $("ue").className = "err"; $("ue").textContent = x.message; }
  return false;
}
async function hapusUser(u) {
  if (!confirm("Hapus pengguna " + u + "?")) return;
  try { tabelUser((await post({ aksi: "hapusPengguna", username: u })).data); batalEdit(); } catch (x) { $("ue").className = "err"; $("ue").textContent = x.message; }
}
terapkanPengaturan(); renderAkun(); $("saya").onchange = gambar;
$("seg").onclick = function (e) { var b = e.target.closest("button"); if (!b) return; S.jenis = b.dataset.j; [].forEach.call($("seg").children, function (x) { x.classList.toggle("on", x === b); }); gambar(); };
$("q").oninput = gambar; $("selesai").onchange = gambar; $("kelas").onchange = gambar; $("prodi").onchange = function () { $("kelas").value = ""; isi(); };
$("refresh").onclick = muat;
$("dark").onclick = function () { var d = document.documentElement, x = d.dataset.theme !== "dark"; d.dataset.theme = x ? "dark" : "light"; $("dark").textContent = x ? "☀️" : "🌙"; };
if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) $("dark").click();
$("chips").onclick = function (e) { var b = e.target.closest(".chip"); if (b) $("d-" + b.dataset.k).scrollIntoView({ behavior: "smooth", block: "start" }); };
var tk = 0;
window.addEventListener("scroll", function () {
  if (tk) return;
  tk = requestAnimationFrame(function () {
    tk = 0; $("top").hidden = scrollY < 600; var cur = null;
    [].forEach.call(document.querySelectorAll(".day"), function (d) { if (d.getBoundingClientRect().top <= 110) cur = d.id.slice(2); });
    [].forEach.call($("chips").children, function (c) { var on = c.dataset.k === cur; if (on && !c.classList.contains("on")) c.scrollIntoView({ inline: "center", block: "nearest" }); c.classList.toggle("on", on); });
  });
}, { passive: true });
$("top").onclick = function () { scrollTo({ top: 0, behavior: "smooth" }); };
$("ftoggle").onclick = function () { var o = document.querySelector(".fil").classList.toggle("open"); this.setAttribute("aria-expanded", o); };
muat(); hitung(); setInterval(hitung, 1000); setInterval(muat, CONFIG.AUTO_REFRESH_MINUTES * 6e4); setInterval(gambar, 6e4);
</script>
