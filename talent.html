header h1{margin:0;flex:1;display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;text-shadow:0 1px 2px #0005}.tn{font-size:2rem;letter-spacing:3px;line-height:1}.tg{font-size:.9rem;font-weight:400;max-width:380px;line-height:1.25;border-left:3px solid var(--y);padding-left:10px}header small{flex-basis:100%;font-size:.8rem;font-weight:400;opacity:.92}
#us{background:#fff;color:#7a1013;padding:4px 10px;border-radius:14px;font-size:.85rem;font-weight:600}#us:empty{display:none}
button,select,input,textarea{font:inherit}
.btn{background:var(--r);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}.btn:hover{filter:brightness(.92)}
.btn.o{background:#fff;color:var(--r);border:1px solid var(--r)}.btn.r{background:#7a1013;color:#fff;border:0}.btn.s{padding:3px 9px;font-size:.78rem}
nav{display:flex;gap:6px;padding:10px 20px;overflow:auto;background:#fff;border-bottom:3px solid var(--y);box-shadow:0 1px 4px #0002;position:sticky;top:0}
nav button{border:0;background:none;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}nav button.on{background:var(--y);color:#2a1a1a;font-weight:600;box-shadow:inset 0 -3px 0 var(--r)}
main{max-width:1150px;margin:auto;padding:18px}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.c,.box{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 5px #0001;margin-bottom:12px;border-top:3px solid var(--y)}.c{margin:0}.c h3{margin:8px 0 4px;font-size:1rem}.c p{margin:3px 0;font-size:.9rem}
.box label{display:block;margin:10px 0 3px;font-size:.85rem}.box input:not([type=checkbox]),.box select,.box textarea,dialog input:not([type=checkbox]),dialog select,dialog textarea{width:100%;padding:8px;border:1px solid #d9c48a;border-radius:8px}.tb input,.tb select{padding:8px;border:1px solid #d9c48a;border-radius:8px}
dialog label{display:block;margin:9px 0 3px;font-size:.85rem}
.bd{background:#fff7a8;color:#9d1218;padding:2px 9px;border-radius:12px;font-size:.75rem}.bd.w{background:var(--y);color:#2a1a1a}.bd.x{background:#ffd9d9;color:#7a1013}.m{color:#7a6a5a;font-size:.82rem}
.ov{overflow:auto}table{border-collapse:collapse;width:100%;font-size:.86rem}th,td{padding:7px 9px;border-bottom:1px solid #f1e8a8;text-align:left}th{background:#fff8bf}
.bar{height:10px;background:linear-gradient(90deg,var(--r),var(--y));border-radius:5px}
dialog{border:0;border-radius:14px;padding:20px;width:min(460px,92vw);border-top:4px solid var(--r)}dialog::backdrop{background:#0006}
.st{font-size:1.9rem;font-weight:700;color:var(--r)}#bn{background:#fff1a8;padding:8px 20px;font-size:.85rem}a{color:#c01820}
</style></head><body>

async function fsave(s){var d={};for(var f of FF){var el=$("f_"+f[0]);if(f[1]=="file"){if(el.files[0])d.Bukti=await up(el.files[0]);continue}d[f[0]]=el.value.trim();if(!d[f[0]]&&!OPT.test(f[0]))return alert("Lengkapi: "+f[0])}await api("save",s,d);$("dg").close();view(V)}
function csv(n,r){var c=Object.keys(r[0]||{Data:""});var t=[c].concat(r.map(x=>c.map(k=>x[k]))).map(l=>l.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\n");var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download=n+".csv";a.click()}
